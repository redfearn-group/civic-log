agenda: >-
  UTAH COUNTY

  Community Development

  (801)851-8343 51 S. University Ave.

  Suite 117

  Provo, Utah 84601


  NOTICE OF PUBLIC HEARING


  The Utah County Planning Commission will hold a public hearing at its regular meeting on September
  15th, 2026, at 5:30 p.m. in Room 1400 of the Utah County Administration Building, 100 East Center
  Street, Provo, Utah, to consider and receive comments for the following:


  - Request from Utah County Commission for a proposed Utah County Land Use Ordinance text amendment
  to Chapters 2, 8, 10, 12, and any other applicable section, to add Data Centers as a permitted use
  in the Mining and Grazing (M&G-1) and Industrial (I-1) Zones, add a Data Center Overlay (DCO)
  Zone, and add associated development standards and requirements for Data Centers


  Additional information can be found at https://codev.utahcounty.gov/planning-commission/2026/9.
  The Utah Public Notice Website can be found online at: pmn.utah.gov.


  Written comments or information related to the items must be submitted prior to the meeting no
  later than 1:00 p.m. on the day of the meeting to planningcommission@utahcounty.gov. No written
  comments or material will be accepted at the meeting.


  This public hearing can be viewed live on YouTube under the heading UTAH COUNTY GOVERNMENT or by
  going to the following link:

  https://www.youtube.com/channel/UCkRYDnXVDLGv9792bhWn9Wg

  This YouTube link will only provide the opportunity to view the proceedings. Participation in the
  public hearing is required in person at the meeting time and location listed above.
