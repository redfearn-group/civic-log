agenda: >-
  (Order of agenda items subject to change at discretion of the Chair)

  This meeting will be a public meeting subject to the Utah Open and Public Meetings Act. Commission
  members may participate electronically at will, with the anchor location as stated above.


  Comments or information related to an agenda item must be submitted prior to the meeting no later
  than 1:00 p.m. on the day of the meeting to planningcommission@utahcounty.gov. No written comments
  or material will be accepted at the meeting.


  Information related to the items on this agenda, along with the Utah County General Plan & Utah
  County Land Use Ordinance, can be found online at: https://codev.utahcounty.gov/


  The Utah Public Notice Website can be found online at: pmn.utah.gov


  This meeting can be viewed live on YouTube under the heading UTAH COUNTY GOVERNMENT or by going to
  the following link:

  https://www.youtube.com/channel/UCkRYDnXVDLGv9792bhWn9Wg


  A. CALL TO ORDER


  B. PLEDGE OF ALLEGIANCE


  C. APPROVAL OF MINUTES - February 17, 2026 regular meeting


  D. ITEMS SUBJECT TO PUBLIC HEARING (PUBLIC HEARING)


  1. Timpanogos Special Service District

  - Proposed amendment of the Utah County General Plan Land Use Element Map from Agricultural to
  Manufacturing, and amendment of the Official Utah County Zone Map from the Residential
  Agricultural (RA-5) and Mining and Grazing (M&G-1) Zones to the Public Facilities (PF) Zone for
  property located in Sections 5 and 8, T9S R1W, approximately 48 acres, Chimney Rock Pass Road area
  of unincorporated Utah County


  2. Jamie Evans

  - Proposed Utah County Land Use Ordinance amendment to Sections 12.40. B, 12.40.D, and any other
  applicable section, to add vehicle impound yards as a permitted use in the Industrial (I-1) Zone
  and to eliminate the minimum area requirement of one(1) acre for yards for the outdoor storage of
  licensed vehicles, heavy equipment, portable structures, contracting equipment, lumber, or earth
  materials (rock, coal, sand) in the Industrial (I-1) Zone


  3. Rocky Mountain Power


  - Proposed Utah County Land Use Ordinance text amendment to Section 8.44.A.4, and any other
  applicable section, to designate electric power transmission and distribution lines of 345 kV and
  over within a new transmission corridor as a permitted use in any zone


  E. AGRICULTURE PROTECTION AREA (NO PUBLIC HEARING)


  1. Notification of creation/continuation of agricultural protection areas

  - Creation of the South Fork Land 2026 APA


  F. OTHER BUSINESS


  G. PUBLIC COMMENT


  H. ADJOURN


  In compliance with the Americans with Disabilities Act, individuals needing special accommodations
  (including auxiliary communicative aids and services) during this meeting should notify staff at
  (801) 851-8343 at least one day prior to the meeting.

  The personal data collected on this form is classified as a public record and may be made
  available to the public as provided by Utah Code 63G-2-201.
