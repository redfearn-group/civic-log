agenda: >-
  NOTICE OF PUBLIC HEARING


  The Utah County Planning Commission will hold a public hearing at its regular meeting on July
  21st, 2026, at 5:30 p.m. in Room 1400 of the Utah County Administration Building, 100 East Center
  Street, Provo, Utah, to consider and receive comments for the following:


  - Request from Chris Cowden for a proposed Utah County Land Use Ordinance text amendment to
  Sections 12.08.D, 12.08.E, and any other applicable section, to reduce the minimum area required
  for a one-family dwelling, manufactured home, or lots in a planned subdivision from 5 acres to 2.5
  acres and reduce the minimum lot/parcel width required for a one-family dwelling, manufactured
  home, or lots in a planned subdivision from 250 feet to 210 feet in the Residential Agricultural
  (RA-5) Zone


  Additional information can be found at https://codev.utahcounty.gov/planning-commission/2026/7 .
  The Utah Public Notice Website can be found online at: pmn.utah.gov.


  Written comments or information related to the items must be submitted prior to the meeting no
  later than 1:00 p.m. on the day of the meeting to planningcommission@utahcounty.gov. No written
  comments or material will be accepted at the meeting.


  This public hearing can be viewed live on YouTube under the heading UTAH COUNTY GOVERNMENT or by
  going to the following link:

  https://www.youtube.com/channel/UCkRYDnXVDLGv9792bhWn9Wg

  This YouTube link will only provide the opportunity to view the proceedings. Participation in the
  public hearing is required in person at the meeting time and location listed above.
