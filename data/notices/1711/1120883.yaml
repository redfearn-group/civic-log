  UTAH COUNTY

  Community Development

  (801)851-8343 51 S. University Ave.

  Suite 117

  Provo, Utah 84601


  NOTICE OF PUBLIC HEARING


  The Utah County Planning Commission will hold a public hearing at its regular meeting on November
  17th, 2026, at 5:30 p.m. in Room 1400 of the Utah County Administration Building, 100 East Center
  Street, Provo, Utah, to consider and receive comments for the following:


  - Request from Utah County Planning Commission for a proposed comprehensive amendment of the Utah
  County Land General Plan. The proposed amendment is being made consistent with Utah Code Ann.
  Title 17, Chapter 79, Part 4. The area affected by this comprehensive general plan amendment will
  only consider land, landscapes, environmental resources, uses, and management within the political
  boundaries of unincorporated Utah County.


  - Request from Landmark Real Estate for a proposed amendment of the Official Utah County Zone Map
  from the Public Facilities (PF) Zone to the Industrial (I-1) Zone for property located in Section
  34, T7S R2E, approximately 240 acres, Spanish Fork/Springville area of unincorporated Utah County.


  - Request from Ute Railway Logistics LLC for a proposed Utah County Land Use Ordinance text
  amendment to Chapters 2, 8, 12, and any other applicable section to add a Rail Transfer Facility
  as a permitted use in the Mining and Grazing (M&G-1) Zone.


  Additional information can be found at https://codev.utahcounty.gov/planning-commission/2026/11.
  The Utah Public Notice Website can be found online at: pmn.utah.gov.


  Written comments or information related to the items must be submitted prior to the meeting no
  later than 1:00 p.m. on the day of the meeting to planningcommission@utahcounty.gov. No written
  comments or material will be accepted at the meeting.


  This public hearing can be viewed live on YouTube under the heading UTAH COUNTY GOVERNMENT or by
  going to the following link:

  https://www.youtube.com/channel/UCkRYDnXVDLGv9792bhWn9Wg

  This YouTube link will only provide the opportunity to view the proceedings. Participation in the
  public hearing is required in person at the meeting time and location listed above.
