agenda: >-
  Notice of Vacancy on the Utah County Planning Commission


  Notice is hereby provided this 18th day of November 2026, pursuant to Utah County Land Use
  Ordinance Section 16.92(8)(1) that two (2) vacancies currently exist on the Utah County Planning
  Commission (the 'Planning Commission'). To be qualified for consideration for the above-mentioned
  vacancy individuals must be a registered voter within the boundaries of Utah County.


  Those individuals interested in being considered for the vacant Planning Commission positions
  outlined above should send a letter expressing their interest together with a brief description of
  their qualifications and eligibility for the Planning Commission position to:
  boards@utahcounty.gov. All letters of interest in the vacant board position must be received by
  the County Commission on or before 5:00 p.m. on December 4th 2026. The Board of County
  Commissioners Utah County Utah will review and evaluate all individuals that qualify for
  consideration pursuant to the guidelines listed above and will appoint an individual to to fill
  the existing vacancy by resolution.
