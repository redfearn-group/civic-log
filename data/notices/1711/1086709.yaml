agenda: >-
  NOTICE OF PUBLIC HEARING


  The Utah County Planning Commission will hold a public hearing at its regular meeting on June
  16th, 2026, at 5:30 p.m. in Room 1400 of the Utah County Administration Building, 100 East Center
  Street, Provo, Utah, to consider and receive comments for the following:


  Request from Craig Max Nelson for a proposed Utah County Land Use Ordinance text amendment to
  Section 4.44 and any other applicable section related to an exception for parcels that are
  separated from required frontage on an approved public road by state or federal land or railroad
  right-of-way


  Request from Utah County Planning Commission for a proposed Utah County Land Use Ordinance text
  amendment to Sections 1.28, 2.08, 16.44, 16.92, and any other applicable section, to comply with
  recent state legislation regarding the following: new and unlisted business uses; definitions of
  certain terms and phrases; Appeal Authority rules and procedures; Planning Commission rules and
  procedures; and any associated ancillary changes


  Additional information can be found at https://codev.utahcounty.gov/planningcommission/2026/6 The
  Utah Public Notice Website can be found online at: pmn.utah.gov.


  Written comments or information related to the items must be submitted prior to the meeting no
  later than 1:00 p.m. on the day of the meeting to planningcommission@utahcounty.gov.

  No written comments or material will be accepted at the meeting.


  This public hearing can be viewed live on YouTube under the heading UTAH COUNTY GOVERNMENT or by
  going to the following link:

  https://www.youtube.com/channel/UCkRYDnXVDLGv9792bhWn9Wg


  This YouTube link will only provide the opportunity to view the proceedings. Participation in the
  public hearing is required in person at the meeting time and location listed above.
