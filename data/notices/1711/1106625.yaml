agenda: >-
  (Order of agenda items subject to change at discretion of the Chair)

  This meeting will be a public meeting subject to the Utah Open and Public Meetings Act. Commission
  members may participate electronically at will, with the anchor location as stated above.


  Comments or information related to an agenda item must be submitted prior to the meeting no later
  than 1:00 p.m. on the day of the meeting to planningcommission@utahcounty.gov. No written comments
  or material will be accepted at the meeting.


  Information related to the items on this agenda, along with the Utah County General Plan & Utah
  County Land Use Ordinance, can be found online at: https://codev.utahcounty.gov/


  The Utah Public Notice Website can be found online at: pmn.utah.gov


  This meeting can be viewed live on YouTube under the heading UTAH COUNTY GOVERNMENT or by going to
  the following link:

  https://www.youtube.com/channel/UCkRYDnXVDLGv9792bhWn9Wg


  A. CALL TO ORDER


  B. PLEDGE OF ALLEGIANCE


  C. APPROVAL OF MINUTES - July 21, 2026 regular meeting


  D. ITEMS SUBJECT TO PUBLIC HEARING (PUBLIC HEARING)


  1. Utah County Commission


  - Proposed Utah County Land Use Ordinance text amendment to Chapters 2, 8, 10, 12, and any other
  applicable section, to add Data Centers as a permitted use in the Mining and Grazing (M&G-1) and
  Industrial (I-1) Zones, add a Data Center Overlay (DCO) Zone, and add associated development
  standards and requirements for Data Centers


  E. OTHER BUSINESS


  F. PUBLIC COMMENT


  G. ADJOURN


  In compliance with the Americans with Disabilities Act, individuals needing special accommodations
  (including auxiliary communicative aids and services) during this meeting should notify staff at
  (801) 851-8343 at least one day prior to the meeting.

  The personal data collected on this form is classified as a public record and may be made
  available to the public as provided by Utah Code 63G-2-201.
