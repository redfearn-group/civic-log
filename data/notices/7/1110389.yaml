  Development Review Committee Agenda
  Wednesday, September 23, 2026
  80 South Main Street in the Council Chambers at Library Hall

  PUBLIC NOTICE is hereby given that the Development Review Committee of Spanish Fork, Utah, will
  hold a meeting in the City Council Chambers at Library Hall, on the second floor, 80 South Main
  Street, Spanish Fork, Utah, commencing at 10 a.m. on September 23, 2026.

  SPANISH FORK CITY does not discriminate on the basis of race, color, national origin, sex,
  religion, age or disability in the employment or the provision of services. The public is invited
  to participate in all Spanish Fork City Development Review Committee. Meetings located at the City
  Council Chambers at Library Hall, 80 South Main Street, Spanish Fork. If you need special
  accommodation to participate in the meeting, please contact the Community Development Office at
  801-804-4580. This meeting is not available to attend virtually.

  1. Approval of Minutes
  1.1 September 16, 2026

  2. Final Plat
  2.1 Zions Landing 2.0 Reapproval
  This proposal involves reapproval of a Final Plat for six residential lots to be located at 1495
  East 400 North.

  3. Site Plan
  3.1 Doug Smith Autoplex
  This proposal involves the development of a commercial lot to accommodate an auto dealership to be
  located at approximately 2850 North 350 East.

  4. General Plan Amendment
  4.1 Ridgeline Townhomes General Plan Map Amendment
  This proposal involves a request to amend the City's General Plan Land Use Map designation from
  Business Park to Mixed Use for parcels located at 1217 North SR-51.
  4.2 Hidden Groves General Plan Map Amendment
  This proposal involves a request to amend the City's General Plan Land Use Map designation from
  Agricultural to Medium Density Residential for parcels located at 119 East South Field Road.

  5. Title 15 Amendments

  5.1 Planning Commission
  This proposal involves updates to Title 15 regarding the Planning Commission.

  6. Concept Review
  6.1 Airport 700 West Parking Lot and Addition Concept

  7. ADJOURNMENT

