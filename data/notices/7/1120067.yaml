agenda: >-
  Development Review Committee Agenda

  Wednesday, November 4, 2026


  80 South Main Street in the Council Chambers at Library Hall


  Development Review Committee Agenda


  PUBLIC NOTICE is hereby given that the Development Review Committee of Spanish Fork, Utah, will
  hold a meeting in the City Council Chambers at Library Hall, on the second floor, 80 South Main
  Street, Spanish Fork, Utah, commencing at 10 a.m. on November 4, 2026.


  SPANISH FORK CITY does not discriminate on the basis of race, color, national origin, sex,
  religion, age or disability in the employment or the provision of services. The public is invited
  to participate in all Spanish Fork City Development Review Committee. Meetings located at the City
  Council Chambers at Library Hall, 80 South Main Street, Spanish Fork. If you need special
  accommodation to participate in the meeting, please contact the Community Development Office at
  801-804-4580. This meeting is not available to attend virtually.


  1. Approval Of Minutes


  1.1 October 21, 2026


  2. Action Items


  2.1 Harmons - Spanish Fork Site Plan

  This proposal involves the development of a commercial lot located at 2643 East 400 North.


  2.2 Canyon Court Plat A Site Plan

  This proposal involves the development of a commercial lot located at 552 North Spanish Fork
  Parkway.


  2.3 Spanish Fork 7-Eleven Minor Subdivision

  This proposal involves the approval of a one lot subdivision at approximately 2300 South Main
  Street.


  2.4 7-Eleven Spanish Fork Site Plan

  This proposal involves the development of a commercial lot located at 2300 South Main Street.


  3. Discussion Items


  3.1 Stewart Farms Concept plan.


  3.2 Horrocks River Bottoms Annexation Concept plan.


  3.3 3400 East City Park Concept plan.


  3.4 Factory Point


  3.5 Construction Site: Fugitive Dust


