agenda: >-
  Development Review Committee Agenda

  Wednesday, August 19, 2026


  80 S. Main Street in the City Council Chambers at Library Hall


  PUBLIC NOTICE is hereby given that the Development Review Committee of Spanish Fork City, will
  hold a meeting in the City Council Chambers at Library Hall, on the second floor, 80 S. Main
  Street, Spanish Fork, Utah, commencing at 10 a.m. on August 19, 2026.


  SPANISH FORK CITY does not discriminate on the basis of race, color, national origin, sex,
  religion, age or disability in the employment or the provision of services. The public is invited
  to participate in all Spanish Fork City Development Review Committee Meetings. Meetings are
  located at the City Council Chambers at Library Hall, 80 S. Main Street, Spanish Fork, Utah. If
  you need special accommodation to participate in the meeting, please contact the Community
  Development Office at 801-804-4580. This meeting is not available to attend virtually.


  1. Approval of Minutes


  1.1 August 12, 2026


  2. Preliminary Plat


  2.1 South Valley Village (Formerly North Lakes)

  This proposal involves approval of a Preliminary Plat for 666 multi-family residential units as
  part of a Master Planned Development located at approximately 2400 North Canyon Creek Parkway.


  2.2 South Valley Village (Anderson)

  This proposal involves approval of a Preliminary Plat for 233 multi-family residential units as
  part of a Master Planned Development located at approximately 2400 North Canyon Creek Parkway.


  3. Zone Change


  3.1 South Valley Village

  This proposal involves a request to change the zoning of multiple properties from the I-1, B-P and
  the C-2 Zoning Districts to the P-F, C-2 and the R-4 with the Master Planned Development Overlay
  to accommodate a residential subdivision and commercial lots to be located at approximately 2400
  North Canyon Creek Parkway.


  4. General Plan Amendment


  4.1 874 West Arrowhead Trail

  This proposal requests that the General Plan Land Use Map designation be changed from Estate
  Density Residential to High Density Residential and Commercial for 5.53 acres of land located at
  874 West Arrowhead Trail.


  5. Concept Review


  5.1 Christensen Property Residential Concept


  6. ADJOURNMENT
