agenda: >-
  Development Review Committee Agenda

  Wednesday, August 12, 2026


  80 S Main Street in the Council Chambers at Library Hall


  Development Review Committee Agenda


  PUBLIC NOTICE is hereby given that the Development Review Committee of Spanish Fork, Utah, will
  hold a meeting in the City Council Chambers at Library Hall, on the second floor, 80 South Main
  Street, Spanish Fork, Utah, commencing at 10 a.m. on August 12, 2026.


  SPANISH FORK CITY does not discriminate on the basis of race, color, national origin, sex,
  religion, age or disability in the employment or the provision of services. The public is invited
  to participate in all Spanish Fork City Development Review Committee. Meetings located at the City
  Council Chambers at Library Hall, 80 South Main Street, Spanish Fork. If you need special
  accommodation to participate in the meeting, please contact the Community Development Office at
  801-804-4580. This meeting is not available to attend virtually.


  1. Approval Of Minutes


  1.1 August 5, 2026


  2. Final Plat


  2.1 Nicolson Industrial Plat A

  This proposal involves the approval of a Final Plat for a three-lot industrial subdivision located
  at 999 West 3800 North.


  3. Site Plan


  3.1 Nicolson Industrial Park

  This proposal involves the development of 12 industrial units located at 999 West 3800 North.


  4. Preliminary Plat


  4.1 Meadow Subdivision Plat A

  This proposal involves approval of a Preliminary plat for six single-family residential lots
  located at 1450 North Meadow Lane.


  5. Master Plan Update


  5.1 Storm Drain Master Plan Update

  This proposal is an update to the Storm Drain Master Plan to match the newly adopted Land Use
  Element of the General Plan.


  6. Discussion Item


  6.1 Northeast Bench Sewer Line


  7. ADJOURNMENT
