agenda: >-
  Wednesday, July 15, 2026

  Development Review Committee

  DEVELOPMENT REVIEW COMMITTEE AGENDA

  PUBLIC NOTICE is hereby given that the Development Review Committee of Spanish Fork, Utah, will
  hold a regular meeting at the City Council Chambers at Library Hall, 80 South Main Street, Second
  Floor, Spanish Fork, Utah, commencing at 10:00 a.m. This meeting is not available to attend
  virtually.

  1. Final Plat

  A. THE VILLAS AT ANNIE'S ACRES SUBDIVISION 2026. This proposal involves approving a Final Plat for
  a Master Planned Development for 111 residential lots located at 1172 South Bradford Lane.

  2. Adjourn

  End
