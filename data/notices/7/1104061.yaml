agenda: >-
  Development Review Committee Agenda

  Wednesday, August 26, 2026


  80 S. Main Street in the Council Chambers at Library Hall


  PUBLIC NOTICE is hereby given that the Development Review Committee of Spanish Fork, Utah, will
  hold a meeting in the City Council Chambers at Library Hall, on the second floor, 80 S. Main
  Street, Spanish Fork, Utah, commencing at 10 a.m. on August 26, 2026.


  SPANISH FORK CITY does not discriminate on the basis of race, color, national origin, sex,
  religion, age or disability in the employment or the provision of services. The public is invited
  to participate in all Spanish Fork City Development Review Committee. Meetings located at the City
  Council Chambers at Library Hall, 80 S. Main Street, Spanish Fork. If you need special
  accommodation to participate in the meeting, please contact the Community Development Office at
  801-804-4580. This meeting is not available to attend virtually.


  1. Approval of Minutes


  1.1 August 12, 2026


  1.2 August 19, 2026


  2. Zone Change


  2.1 Oak Village Zone Change

  This proposal involves a request to change the zoning of a property from R-R and R-1-12 to R-1-9
  and R-1-12 with the Master Planned Development Overlay. The property is located at approximately
  100 South Spanish Fork Parkway.


  3. Preliminary Plat


  3.1 Oak Village Subdivision

  This proposal involves approval of a Preliminary Plat with a Master Planned Development Overlay
  for 110 single-family lots located at approximately 100 South Spanish Fork Parkway.


  4. Site Plan


  4.1 Bank of Utah

  This proposal involves the development of a commercial pad located at 1351 North Canyon Creek
  Parkway.


  4.2 Utah County Jail - Medical and Patrol Parking Lot Additions

  This proposal involves the expansion of parking at the Utah County Jail located at 3075 North Main
  Street.


  5. Concept Review


  5.1 Hidden Groves Concept


  5.2 Hallam Property Concept


  6. ADJOURNMENT
