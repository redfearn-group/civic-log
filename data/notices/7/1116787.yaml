agenda: >-
  Development Review Committee Agenda

  Wednesday, October 21, 2026


  80 South Main Street in the Council Chambers at Library Hall


  Development Review Committee Agenda


  PUBLIC NOTICE is hereby given that the Development Review Committee of Spanish Fork, Utah, will
  hold a meeting in the City Council Chambers at Library Hall, on the second floor, 80 South Main
  Street, Spanish Fork, Utah, commencing at 10 a.m. on October 21, 2026.


  SPANISH FORK CITY does not discriminate on the basis of race, color, national origin, sex,
  religion, age or disability in the employment or the provision of services. The public is invited
  to participate in all Spanish Fork City Development Review Committee. Meetings located at the City
  Council Chambers at Library Hall, 80 South Main Street, Spanish Fork. If you need special
  accommodation to participate in the meeting, please contact the Community Development Office at
  801-804-4580. This meeting is not available to attend virtually.


  1. Approval of Minutes


  1.1 October 7, 2026


  2. Action Items


  2.1 Creekside Village Townhomes Final Plat

  This proposal involves approval of a Final Plat for 169 townhome lots located at 1527 South Main
  Street.


  2.2 Swenson Industrial Preliminary Plat

  This proposal involves approval of a Preliminary Plat for five industrial lots located at 1730
  West SR-77.


  2.3 Larson Park Zone Change & Preliminary Plat


  a. Zone Change


  b. Preliminary Plat


  This proposal involves a request to change the zoning of a property from R-R Rural Residential to
  C-2, R-3 and R-1-15 with the Master Planned Overlay and for approval of a Preliminary Plat
  consisting of 205 residential lots and townhomes and one commercial lot, located at approximately
  1700 West 1900 South.


  2.4 PI & Water Master Plans Update

  This proposal involves updating the City's PI and Water Master Plans.


  3. Discussion Items


  3.1 DVU4 Industrial Warehouse Concept


  3.2 Hydro Building Addition Concept


  4. ADJOURN
