agenda: >-
  NOTICE OF VACANCIES ON THE SPRINGVILLE DRAINAGE DISTRICT BOARD OF TRUSTEES


  Notice is hereby provided this 16th day of September 2026, pursuant to Utah Code Section 17B-1-304
  that three (3) vacancies currently exist on the Springville Drainage District Board of Trustees
  (the 'Board'). To be qualified for consideration for the above-mentioned Board vacancies, the
  individuals (i) must be a registered voter at the location of the member's residence, and (ii) a
  resident residing within the boundaries of the Springville Drainage District (the 'District') or
  an officer or employee of Utah County. The individuals interested in being considered for the
  vacant Board positions outlined above should send a letter expressing their interest, together
  with a brief description of their qualifications and eligibility for the Board positions to:
  boards@utahcounty.gov. All letters of interest in the vacant Board positions must be received by
  the Board of County Commissioners, Utah County, Utah, on or before 5:00 p.m. on Friday, October
  30, 2026. The Board of County Commissioners, Utah County, Utah, will review and evaluate all
  individuals that qualify for consideration pursuant to the guidelines listed above and will
  appoint individuals to fill the vacancies by resolution.
