agenda: >-
  NOTICE OF VACANCY ON THE NORTH UTAH COUNTY WATER CONSERVANCY DISTRICT BOARD OF TRUSTEES


  Notice is hereby provided this 23rd day of September 2026, pursuant to Utah Code Sections I
  7B-l-304 and I 7B-2a-l 005, that one (I) vacancy currently exist on the North Utah County Water
  Conservancy District Board of Trustees (the .'Board'), to fill one (I) expired term. Positions on
  the Board are for individuals who are representatives of a specific geographical area or interest.


  Please view attached notice for complete details.
