agenda: >-
  NOTICE OF PUBLIC HEARING


  In accordance with Utah Code Sections 17-36-23, 17-36-24, and 17-36-26, the Board of County
  Commissioners, Utah County, Utah will hold a public hearing on Wednesday, September 23, 2026 at
  2:00 p.m. at the Utah County Administration Building, 100 East Center Street, Room 1400, Provo,
  Utah, to consider amending the budgets in the County's general fund and various other budgetary
  funds; to consider revisions to the County's estimates of revenues; to consider revising the
  budget appropriations of county departments; and/or to consider transferring unencumbered or
  unexpected appropriation balances from one department in a fund to another department in the same
  fund. After the public hearing the Board of County Commissioners, Utah County, Utah, may amend the
  2026 County's general fund budget and the various other County budgetary funds, may revise the
  County's estimates of revenues, may revise the budget appropriations of county departments, and/or
  may transfer unencumbered or unexpended appropriation balances from one department in a fund to
  another department in the same fund.
