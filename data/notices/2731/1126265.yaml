agenda: >-
  NOTICE OF PUBLIC HEARING

  In accordance with Utah Code Section 17-66-401, the Board of County Commissioners,

  Utah County, Utah, will hold a public hearing on Wednesday, December 2, 2026, at 2:00 PM at

  the Utah County Administration Building, 100 East Center Street, Room 1400, Provo, Utah, to

  consider adopting a final budget or a final amended budget that includes a compensation increase

  or potential compensation increase for county executive officers including (A) the county manager

  or chief administrative officer; (B) the assistant county manager or assistant county chief

  administrative officer; (C) all individuals who are the head or chief of a county department or

  division; and (D) all individuals who are the chief assistant or deputy of a head or chief of a
  county

  department or division.
