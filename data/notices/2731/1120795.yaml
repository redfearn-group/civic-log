agenda: >-
  NOTICE OF PUBLIC HEARING

  In accordance with Utah Code Sections 17-63-304 and 17-63-305, the Board of County Commissioners,
  Utah County, Utah ('Commission'), will hold a public hearing on Wednesday, November 18, 2026, at
  2:00 p.m. at the Utah County Administration Building, I 00 East Center Street, Room 1400, Provo,
  Utah, to consider the adoption of the 2027 budget for Utah County's general fund and various other
  budgetary funds. After the public hearing, the Commission may make final adjustments to Utah
  County's tentative budget and by resolution shall adopt said budget to be in effect for the next
  calendar year, subject to further amendment.


  PUBLIC NOTICE IS HEREBY GIVEN THAT THE BOARD OF COMMISSIONERS OF UTAH COUNTY, UTAH WILL HOLD A
  PUBLIC MEETING IN THE COMMISSION CHAMBERS - ROOM 1400


  OF THE UTAH COUNTY ADMINISTRATION BUILDING 100 E CENTER ST, PROVO, UT 84606 November 18, 2026 -
  2:00 PM


  Board members may participate electronically, when necessary, with the anchor location designated
  as stated above.


  The public may participate at the anchor location stated above. Public comments will be limited to
  two (2) minutes per individual unless otherwise approved by the Board.


  You may watch the meeting live on YouTube under the heading UTAH COUNTY GOVERNMENT or by going to
  the link: https://www.youtube.com/@UtahCountyGovernment/streams


  Next two upcoming Commission meeting dates: Wednesday, December 2, 2026, at 2:00 p.m. and
  Wednesday, December 9, 2026, at 2:00 p.m.


  PRAYER/READING/THOUGHT: TBA

  PLEDGE OF ALLEGIANCE: TBA


