  -Jolynn Clegg, Clerk

  25. APPROVE AND SET A DATE, TIME AND LOCATION FOR A CLOSED MEETING FOR A STRATEGY SESSION TO
  DISCUSS THE PURCHASE, EXCHANGE, OR LEASE OF REAL PROPERTY, WATER RIGHTS, OR WATER SHARES, FOR
