  NOT MOVED TO THE CONSENT AGENDA, ANNOUNCE THE VOTE OF EACH COMMISSIONER)

  -Jolynn Clegg, Clerk

  26. APPROVE AND SET A DATE, TIME AND LOCATION FOR A CLOSED MEETING FOR A STRATEGY SESSION TO
  DISCUSS THE SALE OF REAL PROPERTY, WATER RIGHTS, OR WATER SHARES, PREVIOUSLY PUBLICLY NOTICED FOR
  SALE, FOR TODAY'S DATE, AT THIS LOCATION, FOLLOWING THE COMPLETION OF THE REGULAR AGENDA (IF THIS
