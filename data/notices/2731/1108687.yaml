agenda: >-
  PUBLIC NOTICE IS HEREBY GIVEN THAT THE


  BOARD OF COMMISSIONERS OF UTAH COUNTY, UTAH


  WILL HOLD A PUBLIC MEETING


  IN THE COMMISSION CHAMBERS - ROOM 1400


  OF THE UTAH COUNTY ADMINISTRATION BUILDING


  100 E CENTER ST, PROVO, UT 84606


  September 16, 2026 - 2:00 PM


  Board members may participate electronically, when necessary, with the anchor location designated
  as stated above.


  The public may participate at the anchor location stated above. Public comments will be limited to
  two (2) minutes per individual unless otherwise approved by the Board.


  You may watch the meeting live on YouTube under the heading UTAH COUNTY GOVERNMENT or by going to
  the link: https://www.youtube.com/@UtahCountyGovernment/streams


  Next two upcoming Commission meeting dates: Wednesday, September 23, 2026, at 2:00 p.m. and
  Wednesday, October 7, 2026, at 2:00 p.m.


  PRAYER/READING/THOUGHT: TBA

  PLEDGE OF ALLEGIANCE: TBA


  RECOGNITION

  1. RECOGNITION OF SEPTEMBER 2026 EMPLOYEE OF THE MONTH

  -PJ Maughan, Human Resources


