agenda: >-
  PUBLIC NOTICE IS HEREBY GIVEN THAT THE


  BOARD OF COMMISSIONERS OF UTAH COUNTY, UTAH


  WILL HOLD A PUBLIC MEETING


  IN THE COMMISSION CHAMBERS - ROOM 1400


  OF THE UTAH COUNTY ADMINISTRATION BUILDING


  100 E CENTER ST, PROVO, UT 84606


  August 19, 2026 - 2:00 PM


  Board members may participate electronically, when necessary, with the anchor location designated
  as stated above.


  The public may participate at the anchor location stated above. Public comments will be limited to
  two (2) minutes per individual unless otherwise approved by the Board.


  You may watch the meeting live on YouTube under the heading UTAH COUNTY GOVERNMENT or by going to
  the link: https://www.youtube.com/@UtahCountyGovernment/streams


  Next two upcoming Commission meeting dates: Wednesday, September 2, 2026, at 2:00 p.m. and
  Wednesday, September 16, 2026, at 2:00 p.m.


  PRAYER/READING/THOUGHT: TBA

  PLEDGE OF ALLEGIANCE: TBA


  PUBLIC COMMENTS


  CONSENT AGENDA

  1. APPROVE AND AUTHORIZE AMENDMENT #1 TO AGREEMENT 2026-537 WITH LES OLSON COMPANY TO ADD OMITTED
  MACHINES TO THE SERVICE RATE LISTING.

  -Robert Baxter, Auditor

  2. RESOLUTION AUTHORIZING ADJUSTMENTS OF TAXES AS SPECIFIED IN LETTER #60555 DATED AUGUST 14,
  2026.

  -Burt Harvey, Auditor

  3. RATIFY DECISION ON THE GRAMA APPEAL FILED JULY 24, 2026 BY GEORGE KLEES

  -Adam Beck, Commission

  4. APPROVE AND AUTHORIZE THE SIGNING OF THE 2026 RECREATION GRANT AGREEMENT BETWEEN UTAH COUNTY
  AND SPRINGVILLE CITY.

  -Aileen Conder, Commission

  5. RATIFY THE EXPEDITED APPROVAL OF THE 2026 ANNUAL ACTION PLAN FOR THE CDBG PROGRAM.

  -Phillip Keeve, Community Development

  6. APPROVE THE SIGNING OF AN AGREEMENT WITH SUNDANCE MOUNTAIN RESORT FOR THE ANNUAL MEETING AND
  TRAINING OF THE UTAH VALLEY DRUG PREVENTION COALITION.

  -Juli Van Ginkel, Health

  7. APPROVE AND AUTHORIZE THE SIGNING OF THE THIRD AMENDMENT TO PURCHASE AND SALE AGREEMENT
  2026-481 WITH PEG PRV200 FREEDOM OFFICE LLC

  -Brittany Thorley, Public Works

  8. APPROVE AN AMENDMENT TO 2025-301 FOR VIDEO SECURITY EQUIPMENT FOR VINEYARD CITY

  -Holden Rockwell, Sheriff

  9. TO APPROVE TAX CREDITS AND REFUNDS RECOMMENDED BY THE COUNTY TREASURER'S OFFICE IN CANCELLATION
  LETTER #20506

  -Randilyn Warner, Treasurer

  10. RATIFICATION OF WARRANT REGISTER FOR AUGUST 19, 2026 INCLUDING NOTES AND COMMENTS FROM THE
  COMMISSIONERS AS RECORDED ON THE INTERNAL SYSTEM

  -Jolynn Clegg, Clerk


  REGULAR AGENDA

  1. APPROVE A RESOLUTION AUTHORIZING THE PUBLIC WORKS DIRECTOR TO COMPLETE AND SIGN THE CLOSING
  DOCUMENTS FOR THE PURCHASE OF BUILDING AND PARKING UNIT ONE, FREEDOM COMMONS CONDOMINIUMS

  -Brittany Thorley, Public Works

  2. APPROVE AND AUTHORIZE THE SIGNING OF A PUBLIC ENTITY AFFIDAVIT RELATED TO THE FREEDOM COMMONS
  CONDOMINIUM

  -Brittany Thorley, Public Works

  3. APPROVE THE SIGNING OF AN AMENDMENT TO AN INTERLOCAL COOPERATION AGREEMENT BETWEEN UTAH COUNTY
  AND NORTH POINTE SOLID WASTE SPECIAL SERVICE DISTRICT.

  -Juli Van Ginkel, Health

  4. APPROVE THE SIGNING OF AN AMENDMENT TO AN INTERLOCAL COOPERATION AGREEMENT BETWEEN UTAH COUNTY
  AND SOUTH UTAH VALLEY SOLID WASTE SPECIAL SERVICE DISTRICT.

  -Juli Van Ginkel, Health

  5. APPROVE A RESOLUTION AMENDING THE OPIOID SETTLEMENT FUND BUDGET.

  -Juli Van Ginkel, Health

  6. AUTHORIZE COUNTY ADMINISTRATOR TO SIGN A MEMORANDUM OF AGREEMENT WITH THE UTAH DEPARTMENT OF
  HERITAGE AND ARTS, UTAH STATE LIBRARY DIVISION FOR BOOKMOBILE SERVICES IN UTAH COUNTY.

  -Ezra Nair, Commission

  7. APPROVE THE SIGNING OF A SPONSORSHIP AGREEMENT BETWEEN UTAH COUNTY AND JONNY STALLINGS FOR THE
  PROVO AUTUMN JAZZ FEST

  -Adam Beck, Commission

  8. APPROVE AN AMENDMENT TO THE AGREEMENT BETWEEN UTAH COUNTY GOVERNMENT AND BRADES PLACE USING
  SLFRF/ARPA FUNDS.

  -Adam Beck, Auditor

  9. APPROVE AND AUTHORIZE AN AGREEMENT WITH HONEY BUCKET FOR UTAH COUNTY COMMISSION EVENT 'FIRST
  DOWN PROVO'.

  -Skyler Beltran, Commission

  10. APPROVE AND SET A DATE, TIME AND LOCATION FOR A CLOSED MEETING TO DISCUSS THE CHARACTER,
  PROFESSIONAL COMPETENCE, OR PHYSICAL OR MENTAL HEALTH OF AN INDIVIDUAL OR INDIVIDUALS, FOR TODAY'S
  DATE, AT THIS LOCATION, FOLLOWING THE COMPLETION OF THE REGULAR AGENDA (IF THIS ITEM IS NOT MOVED
  TO THE CONSENT AGENDA, ANNOUNCE THE VOTE OF EACH COMMISSIONER)

  -Jolynn Clegg, Clerk

  11. APPROVE AND SET A DATE, TIME AND LOCATION FOR A CLOSED MEETING FOR A STRATEGY SESSION TO
  DISCUSS THE PURCHASE, EXCHANGE, OR LEASE OF REAL PROPERTY, WATER RIGHTS, OR WATER SHARES, FOR
  TODAY'S DATE, AT THIS LOCATION, FOLLOWING THE COMPLETION OF THE REGULAR AGENDA (IF THIS ITEM IS
  NOT MOVED TO THE CONSENT AGENDA, ANNOUNCE THE VOTE OF EACH COMMISSIONER)

  -Jolynn Clegg, Clerk

  12. APPROVE AND SET A DATE, TIME AND LOCATION FOR A CLOSED MEETING FOR A STRATEGY SESSION TO
  DISCUSS THE SALE OF REAL PROPERTY, WATER RIGHTS, OR WATER SHARES, PREVIOUSLY PUBLICLY NOTICED FOR
  SALE, FOR TODAY'S DATE, AT THIS LOCATION, FOLLOWING THE COMPLETION OF THE REGULAR AGENDA (IF THIS
  ITEM IS NOT MOVED TO THE CONSENT AGENDA, ANNOUNCE THE VOTE OF EACH COMMISSIONER)

  -Jolynn Clegg, Clerk

  13. APPROVE AND SET A DATE, TIME AND LOCATION FOR A CLOSED MEETING FOR A STRATEGY SESSION TO
  DISCUSS PENDING OR REASONABLY IMMINENT LITIGATION, FOR TODAY'S DATE, AT THIS LOCATION, FOLLOWING
  THE COMPLETION OF THE REGULAR AGENDA (IF THIS ITEM IS NOT MOVED TO THE CONSENT AGENDA, ANNOUNCE
  THE VOTE OF EACH COMMISSIONER)

  -Jolynn Clegg, Clerk

  NOTICE OF SPECIAL ACCOMMODATION DURING PUBLIC MEETINGS - In compliance with the Americans with
  Disabilities Act, individuals needing special accommodations (including auxiliary communicative
  aids and services) during this meeting should notify the Utah County Clerk's Office at
  801-851-8113. Handicap parking is available as well as a level entrance to the building.
  Interpretation services are available with prior notice for the hearing disabled.
