  PUBLIC NOTICE IS HEREBY GIVEN THAT THE BOARD OF COMMISSIONERS OF UTAH COUNTY, UTAH


  WILL HOLD A PUBLIC MEETING IN THE COMMISSION CHAMBERS - ROOM 1400


  OF THE UTAH COUNTY ADMINISTRATION BUILDING


  100 E CENTER ST, PROVO, UT 84606


  November 4, 2026 - 2:00 PM


  Board members may participate electronically, when necessary, with the anchor location designated
  as stated above.


  The public may participate at the anchor location stated above. Public comments will be limited to
  two (2) minutes per individual unless otherwise approved by the Board.


  You may watch the meeting live on YouTube under the heading UTAH COUNTY GOVERNMENT or by going to
  the link: https://www.youtube.com/@UtahCountyGovernment/streams


  Next two upcoming Commission meeting dates: Wednesday, November 18, 2026, at 2:00 p.m. and
  Wednesday, December 2, 2026, at 2:00 p.m.


  PRAYER/READING/THOUGHT: TBA

  PLEDGE OF ALLEGIANCE: TBA


  RECOGNITION

  1. RECOGNITION OF NOVEMBER 2026 EMPLOYEE OF THE MONTH.

  -PJ Maughan, Human Resources


  WORK SESSION

  1. ANNUAL REPORT FROM THE USU EXTENSION.

  -Brittany Thorley, Commission

  2. WORK SESSION TO REPORT ON THE UTAH COUNTY VETERANS FOR 2026.

  -Aileen Conder, Commission


  PUBLIC HEARING

  1. PUBLIC HEARING REGARDING (A) THE ISSUANCE OF NOT MORE THAN $30,000,000 OF SALES TAX REVENUE
  BONDS AND (B) ANY POTENTIAL ECONOMIC IMPACT THAT THE IMPROVEMENTS, FACILITY OR PROPERTY FINANCED
  IN WHOLE OR IN PART WITH THE PROCEEDS OF SAID BONDS MAY HAVE ON THE PRIVATE SECTOR.

  -Paul Jones, Commission


  PUBLIC COMMENTS


  CONSENT AGENDA

  1. RATIFICATION OF WARRANT REGISTER FOR NOVEMBER 4, 2026 INCLUDING NOTES AND COMMENTS FROM THE
  COMMISSIONERS AS RECORDED ON THE INTERNAL SYSTEM

  -Jolynn Clegg, Clerk

  2. APPROVAL OF THE PAYROLL WARRANT SUMMARY FOR PAY PERIOD 22-2026

  -Jolynn Clegg, Clerk

  3. APPROVAL OF THE MINUTES FOR THE OCTOBER 21, 2026 BOARD OF COMMISSIONERS OF UTAH COUNTY, UTAH
  PUBLIC MEETING

  -Jolynn Clegg, Clerk

  4. RESOLUTION AUTHORIZING ADJUSTMENTS OF TAXES AS SPECIFIED IN LETTER #60560 DATED OCTOBER 15,
  2026, LETTER #60561 AND BOE LETTER #299 DATED OCTOBER 29, 2026.

  -Burt Harvey, Auditor

  5. RATIFY THE EXECUTION OF AN AGREEMENT WITH ALL PRO SECURITY FOR THE 2026-2027 UTAH COUNTY
  WARMING CENTER.

  -Brittany Thorley, Commission

  6. TO APPROVE AND AUTHORIZE THE SIGNING OF A REIMBURSEMENT REQUEST LETTER TO THE PUBLIC LANDS
  POLICY COORDINATING OFFICE FOR ELIGIBLE EXPENDITURES RELATED TO THE PROVO CANYON RESOURCE
  MANAGEMENT PLAN, AS AUTHORIZED BY HB32 AND IN ACCORDANCE WITH COOPERATIVE AGREEMENT NO. 2024-137
  AND AMENDMENT NO. 1 2025-447; AND AUTHORIZE THE COUNTY ADMINISTRATOR TO SIGN THE ASSOCIATED
  COORDINATING INVOICES.

  -Aileen Conder, Commission

  7. SET A DATE, TIME, AND LOCATION FOR A PUBLIC HEARING TO DISCUSS THE 2027 BUDGET FOR THE GENERAL
  FUND AND OTHER BUDGETARY FUNDS OF UTAH COUNTY, FOR WEDNESDAY, NOVEMBER 18, 2026 AT 2:00 P.M. IN
  THE UTAH COUNTY ADMINISTRATION BUILDING, 100 EAST CENTER STREET, ROOM 1400, PROVO, UTAH.

  -Aileen Conder, Commission

  8. APPROVE AND AUTHORIZE THE SIGNING OF SF-424 FOR A GRANT FOR MENTORING FOR YOUTH IMPACTED BY
  OPIOIDS AND OTHER SUBSTANCES.

  -Skyler Beltran, Commission


  REGULAR AGENDA

  1. APPROVE EXPERT WITNESS AGREEMENT FOR CASE V24-540

  -Zachary Zundel, Attorney

  2. APPROVE EXPERT WITNESS AGREEMENT FOR CASE 251401408

  -Zachary Zundel, Attorney

  3. APPROVE AN AGREEMENT BETWEEN UTAH COUNTY, UTAH, AND GILBERT & STEWART, CPA PC FOR AUDIT
  SERVICES.

  -Adam Beck, Auditor

  4. APPROVE A RESOLUTION TO RESTRICT THE DISCLOSURE OF CHILDREN'S JUSTICE CENTER FORENSIC
  INTERVIEWS TO PROSECUTING ATTORNEYS AND LAW ENFORCEMENT AGENCIES WITHOUT AN ARTIFICIAL
  INTELLIGENCE (AI) ACCEPTABLE USE POLICY

  -Leah Hamby, Children's Justice Center

  5. ADOPT A RESOLUTION AUTHORIZING A PRELIMINARY OFFICIAL STATEMENT AND AN OFFICIAL NOTICE OF BOND
  SALE, AND ALL OTHER DOCUMENTS REQUIRED IN CONNECTION WITH THE ISSUANCE AND SALE OF $30,000,000
  AGGREGATE PRINCIPAL AMOUNT OF SALES TAX REVENUE BONDS, SERIES 2026; AND RELATED MATTERS.

  -Paul Jones, Commission

  6. APPROVE PROPERTY TAX ACTIONS INCLUDED IN RECOMMENDATION LETTER 2026-12

  -Adam Beck, Commission

  7. APPROVE A SETTLEMENT AGREEMENT

  -Adam Beck, Commission

  8. APPROVE A RESOLUTION OF APPOINTMENT OF A BOARD MEMBER TO THE BOARD OF TRUSTEES OF THE NORTH
