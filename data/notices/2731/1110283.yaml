  PUBLIC NOTICE IS HEREBY GIVEN THAT THE BOARD OF COMMISSIONERS OF UTAH COUNTY, UTAH


  WILL HOLD A PUBLIC MEETING IN THE COMMISSION CHAMBERS - ROOM 1400


  OF THE UTAH COUNTY ADMINISTRATION BUILDING 100 E CENTER ST, PROVO, UT 84606


  September 23, 2026 - 2:00 PM


  Board members may participate electronically, when necessary, with the anchor location designated
  as stated above.


  The public may participate at the anchor location stated above. Public comments will be limited to
  two (2) minutes per individual unless otherwise approved by the Board.


  You may watch the meeting live on YouTube under the heading UTAH COUNTY GOVERNMENT or by going to
  the link: https://www.youtube.com/@UtahCountyGovernment/streams


  Next two upcoming Commission meeting dates: Wednesday, October 7, 2026, at 2:00 p.m. and
  Wednesday, October 21, 2026, at 2:00 p.m.


  PRAYER/READING/THOUGHT: TBA

  PLEDGE OF ALLEGIANCE: TBA


  WORK SESSION

  1. PRESENTATION BY MISS UTAH COUNTY.

  -BRANDON GORDON, Commission


  PUBLIC HEARING

  1. PUBLIC HEARING TO DISCUSS AMENDING THE 2026 BUDGETS IN THE COUNTY'S GENERAL FUND AND VARIOUS
  OTHER BUDGETARY FUNDS; REVISING THE COUNTY'S ESTIMATES OF REVENUES; REVISING THE BUDGET
  APPROPRIATIONS OF COUNTY DEPARTMENTS; AND/OR TRANSFERRING UNENCUMBERED OR UNEXPENDED APPROPRIATION
  BALANCES FROM ONE DEPARTMENT IN A FUND TO ANOTHER DEPARTMENT IN THE SAME FUND.

  -Aileen Conder, Commission


