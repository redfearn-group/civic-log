  DEPARTMENT IN THE SAME FUND. SUGGESTED DATE: WEDNESDAY, SEPTEMBER 23, 2026, AT 2:00 P.M. IN ROOM
  #1400 OF THE UTAH COUNTY ADMINISTRATION BUILDING AT 100 EAST CENTER STREET IN PROVO, UTAH.

  -Aileen Conder, Commission


