agenda: >-
  PUBLIC NOTICE IS HEREBY GIVEN THAT THE


  BOARD OF COMMISSIONERS OF UTAH COUNTY, UTAH


  WILL HOLD A BUDGET WORK SESSION


  IN THE HISTORIC COUNTY COURTHOUSE


  51 S UNIVERSITY AVE STE 319, PROVO, UT 84601


  November 3, 2026 - 1:00 PM


  Board members may participate electronically, when necessary, with the anchor location designated
  as stated above.


  WORK SESSION


  1. WORK SESSION REGARDING THE 2027 UTAH COUNTY BUDGET FOR THE GENERAL FUND AND OTHER BUDGETARY
  FUNDS OF UTAH COUNTY, UTAH.

  -Aileen Conder, Commission


  NOTICE OF SPECIAL ACCOMMODATION DURING PUBLIC MEETINGS - In compliance with the Americans with
  Disabilities Act, individuals needing special accommodations (including auxiliary communicative
  aids and services) during this meeting should notify the Utah County Clerk's Office at
  801-851-8113. Handicap parking is available as well as a level entrance to the building.
  Interpretation services are available with prior notice for the hearing disabled.
