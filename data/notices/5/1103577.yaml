agenda: >-
  Public hearings will be held with the Planning Commission and City Council as part of the review
  of the proposed Oak Village Subdivision Zone Change and Preliminary Plat approval request. This
  proposal involves changing the current zoning of multiple properties from R-R and R-1-12 to R-1-9
  and R-1-12 with the Master Planned Development Overlay to accommodate a residential subdivision of
  110 lots as a Master Planned Development to be located at approximately 100 South Spanish Fork
  Parkway.

  FOR MORE INFORMATION: Please contact Kasey Woodard, Community Development Division Secretary, by
  calling 801.804.4580 or emailing kwoodard@spanishfork.gov
