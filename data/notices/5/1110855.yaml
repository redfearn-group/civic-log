agenda: |-
  Notice of Public Hearings

  The City Council will hold public hearings on Tuesday October 6, 2026, at 6:00 pm.

  Zone Change & Preliminary Plat (Public Hearing):

  - Leland Meadows: A public hearing will be held with the City Council as part of the
  review of the proposed Leland Meadows Zone Change and Preliminary Plat approval
  request. This proposal involves changing the current zoning of multiple properties from
  R-R to R-1-6 and R-1-15 with the Master Planned Development Overlay to accommodate
  a residential subdivision of 206 residential lots and garden homes as a Master Planned
  Development to be located at approximately 1200 West 1400 South.

  Zone Change & Preliminary Plat (Public Hearing):

  - Oak Village: A public hearing will be held with the City Council as part of the review of
  the proposed Oak Village Subdivision Zone Change and Preliminary Plat approval
  request. This proposal involves changing the current zoning of multiple properties from
  R-R and R-1-12 to R-1-9 and R-1-12 with the Master Planned Development Overlay to
  accommodate a residential subdivision of 110 lots as a Master Planned Development to
  be located at approximately 100 South Spanish Fork Parkway.

  These hearings will be held in the Council Chambers at 80 South Main Street, Second Floor,
  Spanish Fork. If you have any questions or comments concerning these requests, please
  contact Kasey Woodard at 801.804.4580 or by email at kwoodard@spanishfork.gov. Written
  questions and comments will be forwarded to the City Council.
