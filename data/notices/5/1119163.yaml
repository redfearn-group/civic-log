agenda: >-
  CITY COUNCIL Agenda

  Tuesday, November 3, 2026 at 6:00 PM

  CITY COUNCIL AGENDA PUBLIC NOTICE is hereby given that the City Council of Spanish Fork, Utah,
  will hold a public

  meeting on November 3, 2026 in the Council Chambers, located on the second floor of Library Hall,
  80 South Main

  Street.


  -A Work Session Meeting will begin at 4:30 pm in the Explorer Room.

  -City Council Meeting will begin at 6:00 pm in the Council Chambers.


  Notice is hereby given that: -In the event of an absence of a quorum, agenda items will be
  continued to the next

  regularly scheduled meeting. -By motion of the Spanish Fork City Council, pursuant to Title 52,
  Chapter 4 of the Utah

  Code, the City Council may vote to hold a closed meeting for any of the purposes identified in
  that Chapter.

  - Electronic Participation: Members of the City Council and City Staff may participate by phone,
  zoom, or other

  electronic means.


  1. WORK SESSION AT 4:30 PM

  1.1 100 South Corridor - Roadway Safety Review

  1.2 Thurber Building Update


  2. ADJOURN TO CLOSED MEETING IF NEEDED- IN THE EXPLORER ROOM


  3. CALL TO ORDER

  3.1 Prayer & Motivational Message

  3.2 Pledge, led by invitation


  4. RECOGNITION

  4.1 Presentation of Life Saving Award to Jaden Young

  4.2 Employee of the Quarter


  5. PUBLIC COMMENTS


  6. COUNCIL COMMENTS


  7. STAFF REPORTS


  8. SPANISH FORK 101

  8.1 Snowplowing Operations


  9. CONSENT ITEMS

  9.1 Draft Minutes of City Council for 10-20-2026

  Draft 10 City Council Minutes 10-20-2026 (1).pdf

  9.2 Participation in Albertson's Opioid Settlement


  10. NEW BUSINESS

  10.1 Approval request for an eight-foot tall fence located at 1068 West River Ridge Lane

  10.2 Benefits Broker Agreement - GBS

  10.3 Drinking Water Master Plan and Pressure Irrigation Master Plan Updates


  11. DISCUSSION

  11.1 2027 Calendar of Meetings


  12. ADJOURN TO CLOSED MEETING IF NEEDED IN THE EXPLORER ROOM

  13. CLOSED MEETING


  14. ADJOURNMENT


  City Council

  The City Council usually meets on the first and third Tuesdays of every month (except only one
  meeting in

  July and December: July 7, 2026 and December 8, 2026) at 6 pm preceded by a work session at the
  City

  Offices located at 80 South Main Street. Please check each agenda for times and dates. If you need
  help call

  801-804-4530.

  Mayor Mike Mendenhall, Council member Stacy Beck, Council member Shane Marshall, Council member

  Kevin Oyler, and Council member Jesse Cardon and Council member Landon Tooke, are honored to serve

  you in the capacity of Mayor and City Council members. To send an email to the entire council,
  address your

  email to council@spanishfork.org. This will automatically send an email to each council member.

  We strive to make wise decisions to continue the fine traditions made by those who have gone
  before us.

  These people built a solid foundation upon which our community stands - the foundation is based
  upon

  principles of hard work, dedication and sacrifice. Our meetings are open to the public and we hope
  to hear

  from you so we can work together to continue to build our community on sound principles.

