agenda: >-
  CITY COUNCIL Agenda

  Tuesday, October 20, 2026 at 6:00 PM

  CITY COUNCIL AGENDA PUBLIC NOTICE is hereby given that the City Council of Spanish Fork, Utah,
  will hold a public

  meeting on October 20, 2026 in the Council Chambers, located on the second floor of Library Hall,
  80 South Main

  Street.

  -A Work Session Meeting will begin at 4:30 pm in the Explorer Room.

  -City Council Meeting will begin at 6:00 pm in the Council Chambers.

  Notice is hereby given that:

  -In the event of an absence of a quorum, agenda items will be continued to the next regularly
  scheduled meeting.

  -By motion of the Spanish Fork City Council, pursuant to Title 52, Chapter 4 of the Utah Code, the
  City Council may

  vote to hold a closed meeting for any of the purposes identified in that Chapter.

  - Electronic Participation: Members of the City Council and City Staff may participate by phone,
  zoom, or other

  electronic means.


  1. WORK SESSION AT 4:30 PM

  No formal actions are taken in a work session.

  1.1 Water & Pressurized Irrigation Master Plans

  1.2 Foundry Area Vision


  2. CALL TO ORDER

  2.1 Prayer & Motivational Message

  2.2 Pledge, led by invitation


  3. RECOGNITION

  3.1 Life Saving Award to Jaden Young


  4. PUBLIC COMMENTS

  In order to be considerate of everyone attending the meeting and to more closely follow the

  published agenda times, public comment will be limited to three minutes per person - A

  spokesperson who has been asked by a group to summarize their concerns will be allowed

  five minutes to speak - Comments which cannot be made within these limits should be

  submitted in writing. The Mayor or Council may restrict the comments beyond these

  guidelines.


  5. COUNCIL COMMENTS


  6. STAFF REPORTS


  7. SPANISH FORK 101

  7.1 Property Taxes


  8. CONSENT ITEMS

  These items are considered by the City Council to be routine and will be enacted by a single

  motion. If discussion is desired on any particular consent item, that item may be removed from

  the consent agenda and considered separately.

  8.1 Draft Minutes of City Council for 10-06-2026

  Draft 10 City Council Minutes 10-06-2026.pdf


  9. PUBLIC HEARING

  9.1 Ordinance and Public Hearing on Ridgeline Townhomes General Plan Land Use

  Map Amendment, Zone Change application and Preliminary Plat Approval Request

  Ridgeline Townhomes General Plan Land Use Map Amendment, Zone Change

  Application and Preliminary Plat Approval Request.

  a. General Plan Land Use Map Amendment

  b. Zone Change

  c. Preliminary Plat

  This proposal involves a General Plan Land Use Map Amendment, Zone Change

  and Preliminary Plat approval for a Master Planned Development located at 1271

  North State Route 51. The proposed ordinance would change the Land Use Map

  Designation to High Density Residential. Another proposed ordinance would

  change the zoning to R-3 with the Master Planned Development Overlay. The

  proposed Preliminary Plat contains 45 townhomes.

  report.cc.ridgelinetownhomes.10-20-2026.pdf

  ORD No. Z___- 2026 Ridgeline Townhomes Zone Change.pdf

  ORD No. ___-2026 Ridgeline Townhomes General Plan Map Amendment.pdf


  9.2 Ordinance and Public Hearing on the Nelson Commercial Zone Change

  Nelson Commercial Zone Change. This proposal involves a Zone Change for a

  3.18-acre site located at 2162 South Main Street. The proposed Ordinance would

  change the zoning from Rural Residential to Commercial 2.

  report.cc.nelsoncommercialzonechange.10-20-2026.pdf

  ORD No. Z___- 2026 Nelson Commercial Zone Change.pdf


  9.3 Ordinance and Public Hearing on Shady Oaks General Plan Land Use Map

  Amendment and Zone Change

  Shady Oaks General Plan Land Use Map Amendment and Zone Change.

  a. General Plan Land Use Map Amendment

  b. Zone Change

  The subject property contains 2.54 acres and is located at 3575 East River Bottoms

  Road. The proposed Ordinances would change the General Plan Land Use Map for

  the site to Mixed Use and the zoning of the property to Commercial Office.

  report.cc.shadyoaks.10-20-2026.pdf


  9.4 Zoning Ordinance Amendment for Matters Pertaining to the Planning Commission

  Planning Commission Zoning Text Amendment. This proposed Ordinance would

  add language to bring the Municipal Code into alignment with State Law on

  matters involving the Planning Commission.

  memo.title15planningcommission.9-23-26.pdf

  ORD 2026 Title 15 - Planning Commission.pdf


  10. ADJOURN TO CLOSED MEETING IF NEEDED IN THE EXPLORER ROOM

  The Spanish Fork City Council may temporarily recess the regular meeting and convene in a closed

  session to discuss (a) discussion of the character, professional competence, or physical or mental

  health of an individual (b) strategy sessions to discuss collective bargaining, (c) strategy
  sessions

  to discuss pending or reasonably imminent litigation, (d) strategy sessions to discuss the

  purchase, exchange, or lease of real property, including any form of a water right or water
  shares,

  or to discuss a proposed development agreement, project proposal, or financing proposal related

  to the development of land owned by the state, (e) strategy sessions to discuss the sale of real

  property, including any form of a water right or water shares, (f) discussion regarding deployment

  of security personnel, devices, or systems, (g) investigative proceedings regarding allegations of

  criminal misconduct as provided in Utah Code § 52-4-205.

  11. CLOSED MEETING


  12. ADJOURNMENT

  City Council

  The City Council usually meets on the first and third Tuesdays of every month (except only one
  meeting in

  July and December: July 7, 2026 and December 8, 2026) at 6 pm preceded by a work session at the
  City

  Offices located at 80 South Main Street. Please check each agenda for times and dates. If you need
  help call

  801-804-4530.


  Mayor Mike Mendenhall, Council member Stacy Beck, Council member Shane Marshall, Council member

  Kevin Oyler, and Council member Jesse Cardon and Council member Landon Tooke, are honored to serve

  you in the capacity of Mayor and City Council members. To send an email to the entire council,
  address your

  email to council@spanishfork.org. This will automatically send an email to each council member.

  We strive to make wise decisions to continue the fine traditions made by those who have gone
  before us.

  These people built a solid foundation upon which our community stands - the foundation is based
  upon

  principles of hard work, dedication and sacrifice. Our meetings are open to the public and we hope
  to hear

  from you so we can work together to continue to build our community on sound principles.
