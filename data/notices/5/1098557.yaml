  Ordinance to Create Provisional Business Licenses

  If adopted, this ordinance would modify Title 5 of the Municipal Code to create provisions for the
  administration of Provisional Business Licenses.


  memo.title5provisional.8-4-2026.pdfPublic attachment


  10.2


  Personnel Policy - Definitions Update

  Staff is recommending this policy update to better align the City's Affordable Care Act (ACA)
  compliance practices with operational needs. The ACA permits employers to use a measurement period
  of up to twelve months to determine full-time eligibility for health insurance.


  Moving to a twelve-month measurement period will provide greater flexibility in scheduling
  part-time employees and those working seasonally while ensuring they remain within annual ACA
  eligibility limits.


  Resolution - Personnel Policy - August 4, 2026.docx.pdfPublic attachment The change will also
  simplify administration by consolidating multiple non-benefited employee classifications into a
  single part-time classification, making the policy easier to administer and helping the City more
  effectively maintain compliance with the Affordable Care Act.


