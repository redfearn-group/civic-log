  8.


  SPANISH FORK 101


  8.1


  lo Landarch Reconnaissance Survey Presentation

  The Spanish Fork Reconnaissance Level Survey documented and evaluated 605 primary structures
  within the area bounded by 300 South to 400 North and 300 West to 300 East, providing the City's
  first comprehensive inventory of historic resources in the downtown core. The project was
  completed by Io LandArch with funding provided through a Certified Local Government (CLG) grant,
  with 50% funded by the Utah State Historic Preservation Office and 50% funded by Spanish Fork
  City, for a total project cost of $29,965, of which the City's share was $14,982.50.


  The survey serves as a planning tool to help guide future preservation efforts, land-use
  decisions, and potential historic district considerations, while creating no new regulations or
  restrictions on property owners. Of the 605 buildings evaluated, 275 (45%) were identified as
  eligible or contributing historic resources, 263 (43%) were determined to be non-contributing, and
  67 (11%) were classified as out-of-period, providing the City with valuable information to
  preserve and celebrate Spanish Fork's historic character while planning for its future.
