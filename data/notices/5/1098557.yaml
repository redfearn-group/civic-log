  14.


  ADJOURNMENT


  City Council


  The City Council usually meets on the first and third Tuesdays of every month (except only one
  meeting in July and December: July 7, 2026 and December 8, 2026) at 6 pm preceded by a work
  session at the City Offices located at 80 South Main Street. Please check each agenda for times
  and dates. If you need help call 801-804-4530.


  Mayor Mike Mendenhall, Council member Stacy Beck, Council member Shane Marshall, Council member
  Kevin Oyler, and Council member Jesse Cardon and Council member Landon Tooke, are honored to serve
  you in the capacity of Mayor and City Council members. To send an email to the entire council,
  address your email to council@spanishfork.org. This will automatically send an email to each
  council member.


  We strive to make wise decisions to continue the fine traditions made by those who have gone
  before us. These people built a solid foundation upon which our community stands - the foundation
  is based upon principles of hard work, dedication and sacrifice. Our meetings are open to the
  public and we hope to hear from you so we can work together to continue to build our community on
  sound principles.
