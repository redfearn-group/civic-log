  CC Memo - General Aviation Impact Fee Request.pdfPublic attachment 7-13-26 Water Impact Fee
  Reduction Request General Aviation Development-1.pdfPublic attachment


  9.4


  Franchise Agreement for Strata Networks

  This agreement is a new franchise agreement with Spanish Fork City for Strata Networks. It is a
  standard agreement based upon the provisions of the Municipal Telecommunications License Tax Act,
  Utah Code Ann. § 10-1-401 et seq., and Spanish Fork's Telecommunications Rights-of-Way ordinance
  found in Title 5, Chapter 32, of the Spanish Fork Municipal Code.


  The agreement grants the right to locate wires, cables, and other telecommunications facilities
  within the public rights-of-way in return for payment of the municipal telecommunications license
  tax. It addresses relocation of facilities, construction standards, indemnification, insurance,
  and other typical provisions.


  Because the City's ordinance, state, and federal law require approval of franchise agreements on a
  competitively neutral basis, this item, as have other franchise agreements in the past, is placed
  on the Consent Agenda.


  Franchise Agreement_Spanish Fork City_Strata Networks (Partially Executed).pdfPublic attachment


  9.5


  Direct Award Grant Funds Agreement

  The proposed agreement between the Utah Department of Transportation (UDOT) and Spanish Fork City
  provides a $3,000,000 direct legislative grant for the design and construction of Taxiway Bravo
  Phase III at the Spanish Fork Airport. The funds will be distributed in four quarterly payments of
  $750,000 during Fiscal Year 2026-2027 and must be used solely for the approved project, with all
  funds expended by December 31, 2029. The agreement requires the City to maintain detailed
  financial records, submit annual and final reports, and demonstrate project progress and
  performance, including improvements to airport safety and efficiency such as reducing runway
  crossings and taxiway congestion.


  Spanish Fork Grant Agreement.docx (3).pdfPublic attachment


