  10. DISCUSSION


  10.1 Transportation Utility Fee


  11. ADJOURN TO CLOSED MEETING IF NEEDED IN THE EXPLORER ROOM

  The Spanish Fork City Council may temporarily recess the regular meeting and convene in a closed
  session to discuss (a) discussion of the character, professional competence, or physical or mental
  health of an individual (b) strategy sessions to discuss collective bargaining, (c) strategy
  sessions to discuss pending or reasonably imminent litigation, (d) strategy sessions to discuss
  the purchase, exchange, or lease of real property, including any form of a water right or water
  shares, or to discuss a proposed development agreement, project proposal, or financing proposal
  related to the development of land owned by the state, (e) strategy sessions to discuss the sale
  of real property, including any form of a water right or water shares, (f) discussion regarding
  deployment of security personnel, devices, or systems, (g) investigative proceedings regarding
  allegations of criminal misconduct as provided in Utah Code § 52-4-205.


  12. CLOSED MEETING


  13. ADJOURNMENT


  City Council


  The City Council usually meets on the first and third Tuesdays of every month (except only one
  meeting in July and December: July 7, 2026 and December 8, 2026) at 6 pm preceded by a work
  session at the City Offices located at 80 South Main Street. Please check each agenda for times
  and dates. If you need help call 801-804-4530.


  Mayor Mike Mendenhall, Council member Stacy Beck, Council member Shane Marshall, Council member
  Kevin Oyler, and Council member Jesse Cardon and Council member Landon Tooke, are honored to serve
  you in the capacity of Mayor and City Council members. To send an email to the entire council,
  address your email to council@spanishfork.org. This will automatically send an email to each
  council member.


  We strive to make wise decisions to continue the fine traditions made by those who have gone
  before us. These people built a solid foundation upon which our community stands - the foundation
  is based upon principles of hard work, dedication and sacrifice. Our meetings are open to the
  public and we hope to hear from you so we can work together to continue to build our community on
  sound principles.
