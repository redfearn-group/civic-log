  CITY COUNCIL SPECIAL MEETING Agenda

  September 21, 2026


  80 South Main Street, in the Council Chambers on the 2nd floor in Library Hall


  1.


  WORK SESSION AT 4:30 PM

  No formal actions are taken in a work session.


  1.1 Employee Salary Study

  1.2 Parks & Recreation Fee Proposals


  2. CALL TO ORDER


  2.1 Prayer & Motivational Message

  2.2 Pledge, led by invitation


  3. RECOGNITIONS


  3.1 Matt Barton- Mountain Bike Trail Volunteer

  3.2 Recognition - Spanish Fork City Recorder, Tara Silver - Master Municipal Clerk


  4. PUBLIC COMMENTS

  In order to be considerate of everyone attending the meeting and to more closely follow the
  published agenda times, public comment will be limited to three minutes per person - A
  spokesperson who has been asked by a group to summarize their concerns may be allowed five minutes
  to speak - Comments which cannot be made within these limits should be submitted in writing. The
  Mayor or Council may restrict the comments beyond these guidelines.


  5. COUNCIL COMMENTS


  6. STAFF REPORTS


  7. CONSENT ITEMS

  These items are considered by the City Council to be routine and will be enacted by a single
  motion. If discussion is desired on any particular consent item, that item may be removed from the
  consent agenda and considered separately.


  7.1 Draft Minutes of City Council for 08-18-2026

  City Council - Sep 01 2026 - Minutes - HtmlPublic attachment


  7.2 Amendment No. 1 to the Vending Machines for Spanish Fork City FitCity Center Agreement:
  Addition of Location (Library)

  This amendment to the original agreement adds the Spanish Fork Library as an additional location
  to be serviced by Stocked Vending Co. Other than the addition of the Library, there are no other
  amendments to the original agreement.


  Spanish Fork Library Amendment No1.pdfPublic attachment


  7.3 Patey Aviation Consent to Lease Assignment

  This agreement allows Patey Aviation Development, LLC, to obtain a loan secured by its Development
  Ground Lease. If the tenant defaults, the lender can take over or transfer the lease without
  breaching the Development Ground Lease agreement. The lender can fix issues to keep the lease
  active or create a new one if needed. Insurance and damages are used for repairs or to pay the
  loan, ensuring the lender is protected. Patey Aviation Consent to Lease Assignment.pdfPublic
  attachment


  7.4 Airport Property Acquisition - 3226 N 1150 W Real Estate Purchase Contract & Promissory Note

  Airport Property Acquisition - Taxiway Bravo


  In order to construct the final leg of Taxiway Bravo at the Spanish Fork Municipal Airport, the
  City needs to acquire the property located at 3226 N. 1150 W. The property currently contains a
  veterinary clinic that is leased to an existing tenant.


  Staff has negotiated a purchase price of $1,450,000. The purchase price will be paid in three
  interest-free installments: $500,000 at closing, $500,000 by July 1, 2027 or when the current
  tenant leaves (whichever occurs first), and $450,000 by January 15, 2028. Title to the property
  will transfer to the City at closing upon payment of the first $500,000. At closing, the City will
  also provide the seller with a promissory note for the remaining $950,000.


  The seller has requested the ability to continue the existing lease with the veterinary clinic
  following closing. Under the proposed lease-back agreement, the City will lease the property back
  to the seller for $1.00, allowing the existing tenant to remain until the earlier of termination
  of the tenant's lease or December 31, 2027. During the lease-back period, the seller will remain
  responsible for utilities, property taxes, maintenance, and other applicable expenses.


  Airport Vet Clinic REPC + Add. 1 & Add. 2.pdfPublic attachment


  Promissory Note - 3226 N 1150 W - Haderlie - Airport Vet Clinic .pdfPublic attachment


  8. PUBLIC HEARING


  8.1 Ordinance vacating a portion of Volunteer Drive near the Annie's Acres subdivision

  Staff reports will be posted on Thursday.


  9. NEW BUSINESS


  9.1 Ordinance to Amend Title 15 to define and create requirements for data centers and facilities
  that generate their own electricity.


  This proposal has been put forth by Volition, a company that would like to construct a data center
  in Spanish Fork.


  The City Council held a public hearing on August 18, 2026, where it received significant public
  comment. The Council tabled action on the ordinance to consider the comments received, to conduct
  additional research, and to revise and refine the proposed ordinance language. On September 1,
  2026, the City Council further considered the proposed amendments and tabled the decision, giving
  the staff direction to refine the language. Staff has made the text changes requested at the
  September 1 meeting. Those are reflected in the document titled 'Title 15 - CC 9-2-26 rev.2
  Council edits.'


  Since that time, the staff has received further comments from Councilmembers and incorporated some
  further edits from the applicant and staff. That revised document is titled 'Title 15 - Council,
  SM, Staff, applicant v.2.'


  Title 15 - CC 9-2-26 rev.2 Council edits.pdfPublic attachment Title 15 - Council, SM, Staff,
  applicant v.2.pdfPublic attachment


