agenda: >-
  NOTICE OF THE FISCAL YEAR 2027 BUDGET REVISION 1 PUBLIC HEARING


  A Public Hearing for the Spanish Fork City Fiscal Year 2027 Budget Revision 1 will be held before
  the Spanish Fork City Council on October 6, 2026, at 6:00 P.M. This hearing is to receive public
  comment for the following items:


  1) The proposed Budget Revision 1 for Fiscal Year 2027 Revenues, expenditures, and transfers for
  all funds adn all fees and utility rates schedule.


  This will be held in the Spanish Fork City Council Chambers at 6 pm located at 80 S Main Street,
  Spanish Fork, Utah. All interested residents are invited to attend.


  If you need special accommodation to participate in the meeting please contact the City Manager's
  office, 801-804-4530.

  This was published on the Utah Public Notice Website, the City Website, and posted at the Parks
  and Recreation, Library Hall, and City Hall buildings by the City Recorder on 09-24-2026
