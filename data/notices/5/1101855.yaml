agenda: >-
  CITY COUNCIL Agenda

  Tuesday, August 18, 2026 at 6:00 PM


  CITY COUNCIL AGENDA PUBLIC NOTICE is hereby given that the City Council of Spanish Fork, Utah,
  will hold a public meeting on August 18, 2026 in the Council Chambers, located on the second floor
  of Library Hall, 80 South Main Street.


  -A Work Session Meeting will begin at 4:30 pm in the Explorer Room.


  -City Council Meeting will begin at 6:00 pm in the Council Chambers.


  Notice is hereby given that:


  -In the event of an absence of a quorum, agenda items will be continued to the next regularly
  scheduled meeting.


  -By motion of the Spanish Fork City Council, pursuant to Title 52, Chapter 4 of the Utah Code, the
  City Council may vote to hold a closed meeting for any of the purposes identified in that Chapter.


  - Electronic Participation: Members of the City Council and City Staff may participate by phone,
  zoom, or other electronic means.


  1. WORK SESSION AT 4:30 PM

  No formal actions are taken in a work session.


  1.1 Financing options and possible timelines for station 61 and public works building


  1.2 TUF update and timeline for possible implementation


  2. CALL TO ORDER


  2.1 Prayer & Motivational Message


  2.2 Pledge, led by invitation


  3. PUBLIC COMMENTS

  In order to be considerate of everyone attending the meeting and to more closely follow the
  published agenda times, public comment will be limited to three minutes per person - A
  spokesperson who has been asked by a group to summarize their concerns will be allowed five
  minutes to speak - Comments which cannot be made within these limits should be submitted in
  writing. The Mayor or Council may restrict the comments beyond these guidelines.


  4. COUNCIL COMMENTS


  5. STAFF REPORTS


  6. CONSENT ITEMS

  These items are considered by the City Council to be routine and will be enacted by a single
  motion. If discussion is desired on any particular consent item, that item may be removed from the
  consent agenda and considered separately.


  6.1 Draft Minutes of City Council for 08-04-2026

  08 DRAFT City Council Minutes 08-04-2026 (4).pdf


  6.2 Utah County Tourism Tax Advisory Board (TTAB) Grant Agreement

  The Airport Manager applied for grant funding through the Utah County Tourism Tax Advisory Board
  (TTAB) to support the 2026 Wings & Wheels Airshow. Following a successful presentation to the
  TTAB, the Airport was awarded $25,000 to assist with eligible event expenses, including
  advertising, event management, and crowd control. Approval is requested to authorize the Mayor,
  City Recorder, and City Attorney to execute the grant agreement on behalf of Spanish Fork City.


  487_2026_AGREEMENTS_6152026.pdfPublic attachment


  6.3 FAA Federal Contract Tower Reimbursable Agreement

  The FAA has presented Spanish Fork Airport with a Reimbursable Agreement to initiate the Federal
  Contract Tower Siting Study. While the study is fully reimbursable by the FAA, the Airport is
  required to advance the approximately $100,000 cost, with reimbursement occurring at a later date.


  Execution of this agreement represents the official start of the Federal Contract Tower Program at
  Spanish Fork Airport and marks a significant milestone in the partnership between the Airport and
  the FAA. The siting study will identify the optimal location for the future control tower and is
  the first major step in the design and implementation process. Based on current FAA timelines,
  construction of the control tower is anticipated to begin within approximately five years of
  executing this agreement.


  The Spanish Fork Airport Advisory Board unanimously recommended approval of the Reimbursable
  Agreement at its recent meeting. If approved by the City Council, the Airport Manager will be
  authorized to execute the agreement and return it to the FAA, allowing the siting study to
  commence.


  Reimbursable Agreement AJW-FN-WSA-25-NM-007374 (Reimbursable Agreement).pdfPublic attachment


  6.4 HOA West, LLC - Vista View - Fiber Service Agreement

  This agreement gives Vista View residents a volume discounted price on SFCN internet.


  This Bulk Service Agreement outlines an arrangement between HOA West, LLC and Spanish Fork
  Community Network (SFCN) to provide fiber internet services to the Vista View development. Key
  terms include:


  - Services: Fiber internet (up to 500 Mbps) for all units, effective September 1, 2026.


  - Responsibilities: Tenants are automatically enrolled without the option to opt-out. The
  Recipient is responsible for all wiring, maintenance, and testing, which must meet specific
  construction standards.


  - Billing: Services are billed at $30 per unit, per month, through the city's municipal utility
  billing system.


  - Contract Term: The agreement runs for an initial 48-month term, with automatic annual renewals
  thereafter.


  - Termination: After the first 24 months, the agreement can be terminated with 60 days' notice and
  payment of a fee equal to 75% of the remaining term costs


  7. PUBLIC HEARING


  7.1 Ordinance to amend Title 15 to modify the parking requirements for properties that have
  detached accessory dwelling units that are smaller than 650 square feet.

  A change to Utah Code will take effect on October 1, 2026. Spanish Fork City is required to modify
  the zoning code to be consistent with the language in Utah Code that applies to properties with
  detached accessory dwelling units. This proposed Title 15 amendment would bring Spanish Fork City
  into conformity with State Law.


  ordinance.title15detached.8-18-2026.pdfPublic attachment


  7.2 Ordinance to amend the Zoning Map to change the zoning of a property from R-R and R-1-12 to
  C-2 located at approximately 400 North Spanish Fork Parkway.

  This proposal involves changing the zoning of approximately 4.8 acres from R-R Rural Residential
  and R-1-12 Residential to C-2 General Commercial for property located on the southeast corner of
  400 North and Spanish Fork Parkway. Approximately 75 feet of the currently zoned R-1-12 area is
  proposed to be included in the commercial request. The property is currently vacant and in
  agricultural production. The proposed commercial area is bisected by existing overhead power
  lines.


  report.cc.hollowacrescommercial.8-18-2026.pdfPublic attachment


  ORD No. Z_- 2026 Hollow Acres Commercial Zone Change.pdfPublic attachment


  7.3 Ordinance to Amend Title 15 to define and create requirements for data centers and facilities
  that generate their own electricity

  This proposal has been put forth by Volition, a company that would like to construct a data center
  in Spanish Fork. Volition's proposal has been updated to incorporate recommendations made by the
  Planning Commission. While the Planning Commission recommended that the proposal be modified, the
  Commission also failed to make a positive recommendation on the proposal. A motion to recommend
  approval failed to pass with a three to three tie vote.


  memo.volition.8-18-2026_6463 (2).pdf


  8.NEW BUSINESS


  8.1Interlocal Cooperation Agreement for Building Inspection and Plan Review Services

  At the request of Mapleton City, the Spanish Fork Building Inspection Division would like to enter
  into an interlocal agreement with Mapleton City for building inspection and plan review services.
  This interlocal agreement would provide building inspections and plan review services on an
  as-needed basis for both Mapleton and Spanish Fork. This interlocal agreement will fulfil the 2024
  Senate Bill 185 requirement for us to provide three options for building inspections if the
  municipality cannot provide an inspector within three business days. Spanish Fork City doesn't
  anticipate using this service at the current time.


  memo.inspection.interlocal.8.12.2026.pdfPublic attachment


  inspection.interlocal.8.12.2026.pdfPublic attachment


  9.ADJOURN TO CLOSED MEETING IF NEEDED IN THE EXPLORER ROOM

  The Spanish Fork City Council may temporarily recess the regular meeting and convene in a closed
  session to discuss (a) discussion of the character, professional competence, or physical or mental
  health of an individual (b) strategy sessions to discuss collective bargaining, (c) strategy
  sessions to discuss pending or reasonably imminent litigation, (d) strategy sessions to discuss
  the purchase, exchange, or lease of real property, including any form of a water right or water
  shares, or to discuss a proposed development agreement, project proposal, or financing proposal
  related to the development of land owned by the state, (e) strategy sessions to discuss the sale
  of real property, including any form of a water right or water shares, (f) discussion regarding
  deployment of security personnel, devices, or systems, (g) investigative proceedings regarding
  allegations of criminal misconduct as provided in Utah Code § 52-4-205.


  10.CLOSED MEETING


  11.ADJOURNMENT
