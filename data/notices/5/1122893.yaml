  11.NEW BUSINESS


  11.1


  Public Works Building AIA Contract

  The City Council is being asked to approve the AIA contract with Big-D for construction management
  services for the new Public Works Building, including the attached addendum for construction of a
  pre-engineered metal building for the Water Department. The Water Department currently stores
  parts and equipment in three storage containers that must be removed to make way for the new
  Public Works Building. The new $750,000 metal building will be constructed first to provide
  replacement storage and allow the existing containers to be removed so demolition and construction
  of the Public Works Building can begin. The metal building cost is budgeted in the Water
  Department budget. An additional $150,000 in site work will be paid for by the Public Works
  Building project, as the site improvements will ultimately serve that project.


  Approval at this time includes the AIA contract terms, general conditions, and the cost of the
  Water Department metal building. Future phases, including demolition of the existing sewer plant
  and construction of the new Public Works Building, will be brought back to City Council as
  additional contract addenda once those phases have been bid and exact costs have been established.
