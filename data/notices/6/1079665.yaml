agenda: >-
  SF Logo

  Tuesday, May 12, 2026

  City Council and Planning Commission Joint Work Session

  CITY COUNCIL AND PLANNING COMMISSION JOINT WORK SESSION MEETING AGENDA

  PUBLIC NOTICE is hereby given that the City Council and Planning Commission of Spanish Fork, Utah,
  will hold a special meeting in the Explorer Room in Library Hall, 80 South Main Street on the
  second floor commencing at 5:30 p.m. on May 12, 2026, Spanish Fork.


  SPANISH FORK CITY does not discriminate on the basis of race, color, national origin, sex,
  religion, age or disability in the employment or the provision of services. The public is invited
  to participate in all Spanish Fork City Council and Planning Commission Meetings. If you need
  special accommodation to participate in the meeting, please contact the Community Development
  Department at 801-804-4580.

  1. Work Session - No formal actions are taken in a work session.

  2. Call to order 5:30 pm.

  3. Required Training

  A. Land Use Training provided by City Attorney Vaughn Pickell.

  4. Concept Presentation

  A. Heritage Community.

  5. Discussion

  A. City Council and Planning Commission discussion.

  6. Adjourn 8:00 pm.

  End
