agenda: >-
  Planning Commission Agenda

  Wednesday, September 2, 2026


  80 S. Main Street in the Council Chambers at Library Hall


  PUBLIC NOTICE is hereby given that the Planning Commission of Spanish Fork, Utah, will hold a
  meeting in the City Council Chambers at Library Hall, on the second floor, 80 S. Main Street,
  Spanish Fork, Utah, with a work session commencing at 5:15 p.m., and the Planning Commission
  Meeting commencing at 6:00 p.m. on September 2, 2026.


  Planning Commissioners:


  Michelle Carroll


  Michael Clayson


  Paul Dayton


  Dave Woodhouse


  Darrin Mellor


  Megan Johnson


  SPANISH FORK CITY does not discriminate on the basis of race, color, national origin, sex,
  religion, age or disability in the employment or the provision of services. The public is invited
  to participate in all Spanish Fork City Planning Commission Meetings located at the City Council
  Chambers at Library Hall, 80 South Main Street, Spanish Fork. If you need special accommodation to
  participate in the meeting, please contact the Community Development Office at 801-804-4580.


  1. 5:15 pm WORK SESSION- No formal actions are taken in a work session


  2. 6: 00 pm Agenda Items


  3. ADOPTION OF MINUTES


  3.1 August 5, 2026


  4. Preliminary Plat


  4.1 Meadow Subdivision Plat A

  This proposal involves approval of a Preliminary plat for six single-family residential lots
  located at 1450 North Meadow Lane.


  5. ZONE CHANGE (Public Hearing)


  5.1 Oak Village Zone Change

  This proposal involves a request to change the zoning of multiple properties from R-R and R-1-12
  to P-F, R-1-12 and R-1-9 with the Master Planned Development Overlay. The property is located at
  approximately 100 South Spanish Fork Parkway.


  6. PRELIMINARY PLAT (Public Hearing)


  6.1 Oak Village Subdivision

  This proposal involves approval of a Preliminary Plat with the Master Planned Development Overlay
  for 110 single-family residential lots to be located at approximately 100 South Spanish Fork
  Parkway.


  7. ADJOURNMENT


  End
