agenda: >-
  SF Logo

  Wednesday, May 6, 2026

  Planning Commission

  Planning Commission Agenda

  PUBLIC NOTICE is hereby given that the Planning Commission of Spanish Fork, Utah, will hold a
  meeting in the City Council Chambers at Library Hall, on the second floor, 80 South Main Street,
  Spanish Fork, Utah, with a work session commencing at 5:15 p.m., and the Planning Commission
  Meeting commencing at 6:00 p.m. on May 6, 2026.

  Planning Commissioners


  Todd Mitchell

  Shauna Warnick

  Michelle Carroll

  Michael Clayson

  Paul Dayton

  Dave Woodhouse


  SPANISH FORK CITY does not discriminate on the basis of race, color, national origin, sex,
  religion, age or disability in the employment or the provision of services. The public is invited
  to participate in all Spanish Fork City Planning Commission Meetings located at the City Council
  Chambers at Library Hall, 80 South Main Street, Spanish Fork. If you need special accommodation to
  participate in the meeting, please contact the Community Development Office at 801-804-4580.

  1. 5:15pm WORK SESSION - No formal actions are taken in a work session.

  A. THOMAS MULTI-FAMILY CONCEPT REVIEW.

  2. 6:00 Agenda Items

  3. Minutes

  A. April 1, 2026.

  4. Zone Change (Public Hearing)

  A. STATION 61 - ARGYLE SUBSTATION ZONE CHANGE. This proposal involves changing the zoning from R-O
  and R-1-6 to P-F to accommodate the development of a new City Fire Station and power substation at
  137 West Center Street.

  B. ARROWHEAD COMMERCIAL. This proposal involves changing the zoning from R-1-12 to C-2 General
  Commercial located at approximately 450 West 1675 South.

  5. Project Signage Plans

  A. MAVERIK CONVENIENCE STORE SIGNAGE PLAN. This proposal involves approval of a signage plan for a
  convenience store location at 1399 North Main Street.

  B. DOUG SMITH PROJECT SIGNAGE PLAN. This proposal involves the approval of a signage plan for a
  proposed auto dealership located at approximately 200 East 2940 North.

  6. Adjourn

  End
