agenda: >-
  Notice of Public Hearings


  The City Council and Planning Commission will hold public hearings on Wednesday, October 7, 2026,
  and

  Tuesday, October 20, 2026, at 6:00 pm.


  Zone Change & General Plan Amendment (Public Hearing):

  Shady Oaks Event Center

  Public hearings will be held with the Planning Commission and City Council on a proposed Zone Map

  Amendment and a General Plan Amendment on the subject property located at 3575 East River Bottoms

  Road. The Zone Map Amendment would change the zoning from R-1-30 to C-O and the General Plan

  Amendment would change the land use designation from Medium Density Residential to Mixed Use.


  Zone Change (Public Hearing):

  Builders FirstSource

  Public hearings will be held with the Planning Commission and City Council on a proposed Zone Map

  Amendment to change the zoning of the subject property located at 1617 North 300 West, from R-R to
  I-1.


  Zone Change (Public Hearing):

  Nelson Commercial

  Public hearings will be held with the Planning Commission and City Council on a proposed Zone
  Change from

  R-R Rural Residential to C-2 General Commercial for property located at 2162 South Main Street.


  General Plan Map Amendment, Zone Change &amp; Preliminary Plat (Public Hearing):

  Ridgeline Townhomes

  Public hearings will be held with the Planning Commission and City Council to review the proposed
  Ridgeline

  Townhomes development, located at approximately 1217 North SR-51. The proposal involves a General
  Plan

  Map Amendment from Business Park to High Density Residential and a Zone Change request from C-2

  General Commercial to R-3 Residential. This includes the Master Planned Development Overlay to
  allow for a

  Preliminary Plat with 45 townhome units as a Master Planned Development.


  Title 15 Amendments (Public Hearing):

  Planning Commission: This proposal updates Title 15 regarding the procedures and training for the
  Planning

  Commission based on recently adopted state code.


  Title 15 Amendments (Public Hearing):

  Volleyball Training Facility: This proposal requests an amendment to the city&#39;s Municipal Code
  to allow indoor

  volleyball facilities as a permitted use in the I-1 Light Industrial Zone.

  These hearings will be held in the Council Chambers at 80 South Main Street, Second Floor, Spanish
  Fork. If

  you have any questions or comments concerning these requests, please contact Kasey Woodard at

  801.804.4580 or by email at kwoodard@spanishfork.gov. Written questions and comments will be
  forwarded to

  the City Council.
