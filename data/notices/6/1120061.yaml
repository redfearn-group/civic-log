agenda: >-
  Planning Commission Agenda

  Wednesday, November 4, 2026


  80 South Main Street in the Council Chambers at Library Hall


  Planning Commission Agenda


  PUBLIC NOTICE is hereby given that the Planning Commission of Spanish Fork, Utah, will hold a
  meeting in the City Council Chambers at Library Hall, on the second floor, 80 South Main Street,
  Spanish Fork, Utah, with a work session commencing at 5:00 p.m., and the Planning Commission
  Meeting commencing at 6:00 p.m. on November 4, 2026.


  Planning Commissioners


  Michelle Carroll


  Michael Clayson


  Paul Dayton


  Dave Woodhouse


  Darrin Mellor


  Megan Johnson


  SPANISH FORK CITY does not discriminate on the basis of race, color, national origin, sex,
  religion, age or disability in the employment or the provision of services. The public is invited
  to participate in all Spanish Fork City Planning Commission Meetings located at the City Council
  Chambers at Library Hall, 80 South Main Street, Spanish Fork. If you need special accommodation to
  participate in the meeting, please contact the Community Development Office at 801-804-4580.


  1. 5:00 pm WORK SESSION- No formal actions are taken in a work session


  2. 6:00 pm Agenda Items


  3. Approval of Minutes


  3.1 October 7, 2026


  4. Action Items


  4.1 Swenson Industrial Preliminary Plat

  This proposal involves approval of a Preliminary Plat for one industrial lot located at 1730 West
  SR-77.


  5. Public Hearings


  5.1 South Valley Village Zone Change & Preliminary Plat


  a. South Valley Village Annexation (No Public Hearing)


  b. South Valley Village Zone Change


  c. South Valley Village Preliminary Plat


  d. South Valley Village (Anderson) Preliminary Plat


  This proposal involves changing the current zoning of multiple properties from I-1, B-P and C-2 to
  P-F, C-2 and the R-4 with the Master Planned Development Overlay to accommodate commercial lots
  and two residential subdivisions with a combined total of 896 multi-family residential units as a
  Master Planned Development to be located at approximately 2400 North Canyon Creek Parkway. This
  proposal also involves a request to annex 18.76 acres of land into the city. The subject parcels
  are located at approximately 2400 North Canyon Creek Parkway.


  5.2 PI & Water Master Plans Update

  This proposal involves updating the City's PI and Water Master Plans.


  6. ADJOURN
