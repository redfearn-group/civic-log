agenda: >-
  SF Logo

  Wednesday, July 1, 2026

  Planning Commission

  Planning Commission Agenda

  PUBLIC NOTICE is hereby given that the Planning Commission of Spanish Fork, Utah, will hold a work
  session commencing at 5:30 p.m. During the work session, the Planning Commission will tour various
  sites throughout the city. The scheduled Planning Commission Meeting will commence at 7:30 p.m. on
  July 1, 2026 in the City Council Chambers at Library Hall, on the second floor, 80 South Main
  Street, Spanish Fork, Utah.

  Planning Commissioners


  Todd Mitchell

  Shauna Warnick

  Michelle Carroll

  Michael Clayson

  Paul Dayton

  Dave Woodhouse


  SPANISH FORK CITY does not discriminate on the basis of race, color, national origin, sex,
  religion, age or disability in the employment or the provision of services. The public is invited
  to participate in all Spanish Fork City Planning Commission Meetings located at the City Council
  Chambers at Library Hall, 80 South Main Street, Spanish Fork. If you need special accommodation to
  participate in the meeting, please contact the Community Development Office at 801-804-4580.

  1. 5:30pm WORK SESSION - No formal actions are taken in a work session.

  2. 7:30 Agenda Items

  3. Minutes

  A. June 3, 2026.

  4. Preliminary Plat

  A. NICOLSON INDUSTRIAL PARK. This proposal involves approval of a Preliminary Plat for a three-lot
  industrial subdivision located at 999 West 3800 North.

  B. VERK 1 SUBSTATION. This proposal involves the approval of a Preliminary Plat for the
  development of a substation located at 1730 West 3400 North.

  5. Adjourn

  End
