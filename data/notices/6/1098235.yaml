agenda: >-
  Planning Commission Agenda

  Wednesday, August 5, 2026


  80 South Main Street in the Council Chambers at Library Hall


  Planning Commission Agenda


  PUBLIC NOTICE is hereby given that the Planning Commission of Spanish Fork, Utah, will hold a
  meeting in the City Council Chambers at Library Hall, on the second floor, 80 South Main Street,
  Spanish Fork, Utah, with a work session commencing at 5:15 p.m., and the Planning Commission
  Meeting commencing at 6:00 p.m. on August 5, 2026.


  Planning Commissioners


  Shauna Warnick

  Michelle Carroll

  Michael Clayson

  Paul Dayton

  Dave Woodhouse

  Darrin Mellor


  SPANISH FORK CITY does not discriminate on the basis of race, color, national origin, sex,
  religion, age or disability in the employment or the provision of services. The public is invited
  to participate in all Spanish Fork City Planning Commission Meetings located at the City Council
  Chambers at Library Hall, 80 South Main Street, Spanish Fork. If you need special accommodation to
  participate in the meeting, please contact the Community Development Office at 801-804-4580.


  1. 5:15 pm WORK SESSION- No formal actions are taken in a work session


  2. 6: 00 pm Agenda Items


  3. ADOPTION OF MINUTES


  3.1 July 1, 2026


  Recommendation: That the Minutes be adopted as presented


  4. PRELIMINARY PLAT (Public Hearing)


  4.1 Leland Meadows Preliminary Plat

  This proposal involves approval of a Preliminary Plat for a Master Planned Development with 206
  residential lots and garden homes to be located at approximately 1200 West 1400 South.


  5. ZONE CHANGE (Public Hearing)


  5.1 Leland Meadows Zone Change

  This proposal involves changing the current zoning of multiple properties from R-R to R-1-6 and
  R-1-15 with the Master Planned Development Overlay to accommodate a residential subdivision of 206
  residential lots and garden homes as a Master Planned Development to be located at approximately
  1200 West 1400 South.


  5.2 Hollow Acres Commercial Zone Change

  This proposal involves changing the zoning of a property from R-R and R-1-12 to C-2 located at
  approximately 400 North Spanish Fork Parkway.


  6. TITLE 15 AMENDMENTS (Public Hearing)


  6.1 Detached Accessory Dwellings

  This proposal would modify the parking requirements for some properties with detached accessory
  dwellings.


  6.2 Volition

  This proposal would create requirements for data centers and facilities that generate their own
  electricity.


  7. ADJOURNMENT


  End
