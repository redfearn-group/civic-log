headline: Utah County 2027 budget hearing and $30M sales tax bond sale on 18 NOV 2026 agenda
summary: The Utah County Commission met on 18 NOV 2026 at 2:00 p.m. in Provo with a public hearing on the 2027 county budget, then a long regular agenda. It included a $30,000,000 sales tax revenue bond sale, a 2027-2029 capital plan, and a new county ordinance on large power transmission lines. No minutes or recording of results were attached, so outcomes are not known here.
