headline: "County budget hearing, $30M sales tax bond and transmission line rules on 18 NOV agenda"
summary: "The Utah County Commission met on 18 NOV 2026 at 2:00 PM in Room 1400, Provo. It held a public hearing on the 2027 budget and could adopt it by resolution. The regular agenda also had a $30,000,000 sales tax revenue bond sale, the 2027-2029 capital improvement plan and a land use ordinance on 345 kV transmission lines."
