headline: "Utah County Planning Commission heard the county data center ordinance, 15 SEP"
summary: "The Utah County Planning Commission held a public hearing on 15 SEP 2026 on a proposed county Land Use Ordinance amendment that would allow data centers in the Mining and Grazing (M&G-1) and Industrial (I-1) zones and add a Data Center Overlay zone. This is the county-wide ordinance the County Commission asked for, so it would apply across unincorporated Utah County. The meeting has passed and the notice has no minutes, so the outcome is not recorded here."
