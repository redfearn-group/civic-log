headline: Council hearings on Ridgeline Townhomes, Nelson Commercial and Shady Oaks rezones
summary: On 20 OCT 2026 the City Council holds four public hearings on land use. Three are map and zone changes (45 townhomes on SR 51, a 3.18-acre commercial rezone on South Main, and a 2.54-acre mixed-use change on River Bottoms Road), and one is a code change on the Planning Commission. Residents can speak at the 6:00 PM meeting or send written comments.
