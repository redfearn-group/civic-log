headline: Council approved Ridgeline Townhomes, Nelson Commercial, Shady Oaks and a Title 15 change
summary: "On 20 OCT 2026 the City Council held four public hearings and, by the meeting video, approved all of them with no opposing vote heard: 45 townhomes on SR 51, a 3.18-acre commercial rezone, a Shady Oaks event center rezone with fence and parking conditions, and a Title 15 Planning Commission change. Minutes of the 06 OCT 2026 meeting, now attached, record the Oak Village and Leland Meadows approvals, Budget Revision 1 and a 3-2 vote on voter participation areas for the Title 15 referendum. Video results are unofficial until these minutes are adopted."
items:
