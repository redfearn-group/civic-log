  - title: Nelson Commercial zone change
    what: Rezone of 3.18 acres at 2162 South Main Street from Rural Residential to Commercial 2, consistent with the General Plan designation of Commercial. A masonry wall is required next to homes.
    tags: [land-use]
    watch: []
