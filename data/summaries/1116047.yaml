headline: Council approved Ridgeline Townhomes, Nelson Commercial, Shady Oaks and a Title 15 change
summary: "On 20 OCT 2026 the City Council, with Councilmembers Oyler and Tooke absent, approved all four agenda items 3-0 per the adopted minutes: 45 townhomes on SR 51, a 3.18-acre commercial rezone on South Main Street, an event center rezone with fence and parking conditions, and a Title 15 update for the Planning Commission. The minutes of the 06 OCT 2026 meeting, now attached, record the Oak Village and Leland Meadows approvals, Budget Revision 1 and a 3-2 vote on voter participation areas for the Title 15 referendum. The Council also asked staff to take up construction dust near existing homes at a future meeting."
items:
  - title: Ridgeline Townhomes
    what: General Plan change to High Density Residential, R-3 zone with Master Planned Development overlay, and a 45-townhome preliminary plat on SR 51. A state-approved soil cleanup plan comes first.
    tags: [land-use, home]
    watch: []
    hearing: true
    applicant: false
    result: "Approved 3-0 (Oyler, Tooke absent): general plan, zone change and preliminary plat"
    resultFrom: minutes
