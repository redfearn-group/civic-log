headline: "Council reviews 100 South safety study, water master plans and a new benefits broker"
summary: "The Spanish Fork City Council met 3 NOV 2026. Staff presented a 100 South corridor safety study requested after the Oak Village hearing, and the council took up the drinking water and pressure irrigation master plans, a new employee benefits broker and an eight-foot fence request. The attached minutes of 20 OCT 2026 record approvals of Ridgeline Townhomes, Shady Oaks, the Nelson Commercial zone change and a Title 15 amendment on the Planning Commission."
items:
  - title: "100 South corridor safety study"
    what: "Staff study: 3,800 to 4,500 daily trips now, about 700 more from Oak Village, within capacity. Flags a slightly substandard curve at 1600 E and a lighting gap at 1800 E."
    tags: [roads, home]
    watch: [developments]
    hearing: false
    applicant: false
    result: null
  - title: "Drinking water and pressure irrigation master plans"
    what: "New business: updates to the city's Drinking Water Master Plan and Pressure Irrigation Master Plan."
