headline: "Council adopted water master plans, approved a benefits broker and an 8-foot fence"
summary: "At the 3 NOV 2026 meeting the Spanish Fork City Council adopted the drinking water and pressure irrigation master plans 5-0, approved the GBS employee benefits broker agreement 5-0, and approved an eight-foot fence request with no opposing vote heard. Council members said the data center application has not been processed and no site plan has been submitted yet. The attached minutes of 20 OCT 2026 record approvals of Ridgeline Townhomes, Shady Oaks, the Nelson Commercial zone change and a Title 15 amendment on the Planning Commission."
items:
  - title: "100 South corridor safety study"
    what: "Staff study: 3,800 to 4,500 daily trips now, about 700 more from Oak Village, within capacity. Flags a slightly substandard curve at 1600 E and a lighting gap at 1800 E."
