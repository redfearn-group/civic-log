  - title: "Minutes, 20 OCT 2026: Ridgeline Townhomes"
    what: "General plan change to high density, rezone from C-2 to R-3 with the Master Planned Development Overlay, and preliminary plat for 45 townhomes at Spanish Fork Parkway and SR-51."
    tags: [land-use]
    watch: []
    hearing: true
    applicant: false
    result: "Approved 3-0 on all three motions (Oyler, Tooke absent)"
    resultFrom: minutes
  - title: "Minutes, 20 OCT 2026: Nelson Commercial zone change"
    what: "Rezoned 3.18 acres at 2162 South Main Street from Rural Residential to Commercial 2."
