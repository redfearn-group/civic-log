    watch: []
    hearing: false
    applicant: false
    result: null
  - title: "Benefits broker agreement with GBS"
    what: "Agreement making GBS Benefits and Consulting the city's employee benefits broker from 1 JAN 2027, chosen unanimously by a staff committee after an RFP with 4 firms. Plans stay the same."
    tags: []
    watch: []
    hearing: false
    applicant: false
    result: null
  - title: "Eight-foot fence, 1068 West River Ridge Lane"
    what: "Request to waive the 6-foot residential fence limit for a fence that steps up to 8 feet along part of a side property line. The code lets the council waive the height at its sole discretion."
