    resultFrom: minutes
  - title: "Minutes, 20 OCT 2026: Shady Oaks"
    what: "Mixed Use plan and Commercial Office zoning for about 2.5 acres at Powerhouse and River Bottoms Roads for an event center, with a solid wall or fence and 60 or more parking spaces."
