headline: "Utah County Commission 16 SEP: county fiber standards, MAG road projects, jail fee"
summary: "The Utah County Commission's 16 SEP 2026 agenda included an engineering agreement for standard specifications for county fiber installation, the list of 2026 MAG-approved road projects funded with county sales tax, and a change to the jail fingerprinting fee. It also covered tax roll and tax adjustment items, a trail feasibility study with Elk Ridge, and UDOT agreements. The meeting has passed and no results are recorded in the notice."
