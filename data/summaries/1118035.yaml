headline: "Utah County Commission budget work session on the 2027 county budget, 28 OCT 2026"
summary: "The Utah County Commission met 28 OCT 2026 in Provo for the second 2027 budget work session. The Treasurer, Information Systems, Auditor, Human Resources and Attorney offices presented new budget requests, with a general budget discussion. The minutes record department budget reviews and no votes other than adjournment. No public hearing was held. The commission approved these minutes on 18 NOV 2026."
