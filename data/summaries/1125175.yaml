headline: Two seats open on the Utah County Planning Commission; letters due 04 DEC 2026
summary: Utah County announced two vacancies on its Planning Commission on 18 NOV 2026. Any registered voter in Utah County may apply by emailing a letter of interest and a short description of qualifications to boards@utahcounty.gov by 5:00 p.m. on 04 DEC 2026. The County Commission will appoint the new members by resolution.
