headline: "County Commission took up its 2027 tentative budget and a mining bond"
summary: "The Utah County Commission met 21 OCT 2026 in Provo. The main item was a resolution tentatively adopting the 2027 budget for the general fund and other funds, alongside a quarry compliance agreement and bond, development bond releases, road agreements and warming center funding. Outcomes are not yet in minutes; an audio recording of the meeting is now posted on the PMN notice."
