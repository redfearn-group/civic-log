headline: "County Commission tentatively adopted its 2027 budget and approved a quarry bond"
summary: "The Utah County Commission met 21 OCT 2026 in Provo. Approved minutes show the 2027 tentative budget, the CMC Rock quarry compliance agreement and bond, road agreements and the winter warming center lease all passed, while an IBM support extension was struck from the agenda. The tentative budget is the starting point for the final 2027 budget, which is still in work sessions."
