headline: "Utah County Commission budget work session on the 2027 county budget, 29 OCT 2026"
summary: "The Utah County Commission held a budget work session on 29 OCT 2026 at 10:00 AM in the Historic County Courthouse, 51 S University Ave, Provo, on the 2027 budget for the General Fund and other county funds. It followed sessions on 27 and 28 OCT 2026, and two more are set for 3 NOV 2026. The agenda listed discussion only, with no public hearing, and the county has posted an audio recording on the notice page."
