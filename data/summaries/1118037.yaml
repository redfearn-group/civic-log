headline: "Utah County Commission budget work session on the 2027 county budget, 29 OCT 2026"
summary: "The Utah County Commission met 29 OCT 2026 in Provo for the third 2027 budget work session. The Children's Justice Center, Assessor, Sheriff, County Administration and Justice Court presented budget requests, followed by general discussion. The minutes record department budget reviews and no votes other than adjournment. No public hearing was held. The commission approved these minutes on 18 NOV 2026."
