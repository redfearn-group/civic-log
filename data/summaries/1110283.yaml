headline: "County Commission 23 SEP: budget hearing held, fee and tax ordinances approved"
summary: "The Utah County Commission held its public hearing on amending the 2026 county budgets on 23 SEP 2026, then approved nearly all agenda items on consent, including the jail fingerprinting fee ordinance and two county code ordinances on property tax processing and financial administration. The email retention schedule, the IBM hypercare contract and the property tax actions letter were continued to 07 OCT 2026. A settlement agreement signature was ratified 2-1."
