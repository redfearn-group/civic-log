headline: "Utah County Commission: 2026 budget amendment hearing, jail fee, property tax code"
summary: "The 23 SEP 2026 Utah County Commission agenda included a public hearing to amend the 2026 county budgets, an ordinance changing the jail fingerprinting fee, and ordinances on property tax request processing and financial administration. It also listed county technology contracts, an email retention schedule, road and parkway agreements, and a request to remove land north of Santaquin from an agriculture protection area. The meeting date has passed, and the next Commission meetings are 07 OCT 2026 and 21 OCT 2026 at 2:00 p.m."
