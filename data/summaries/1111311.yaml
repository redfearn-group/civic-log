headline: "Hearings 07 and 20 OCT: four rezones, a 45-townhome plan, two Title 15 amendments"
summary: "The Planning Commission and City Council hold public hearings at 6:00 p.m. on 07 OCT 2026 and 20 OCT 2026 on four zone changes, a General Plan map change with a 45-unit townhome plan, and two Title 15 land use code amendments. Residents can speak at the hearings in the Council Chambers at 80 South Main Street, or send written questions and comments, which are forwarded to the City Council."
