headline: "Planning Commission backs four rezones and a Title 15 amendment, one no heard on a plat"
summary: "On 07 OCT 2026 the Planning Commission held public hearings on a 16.8-acre industrial rezone, a commercial rezone and plat on South Main, a general plan change and rezone on East River Bottoms Road, a 45-unit townhome project on SR-51, and a Title 15 amendment on Planning Commission procedures and training. Per the video, it recommended approval of each to the City Council and approved the Nelson plat itself, with one opposing voice heard on the Ridgeline plat. The City Council decides the rezones and plan changes next."
