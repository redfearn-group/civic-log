headline: "Utah County seeks applicants for a North Utah County Water Conservancy trustee seat"
summary: "The Utah County Commission posted a notice dated 23 SEP 2026 of one vacancy on the North Utah County Water Conservancy District Board of Trustees, to fill an expired term. The seat is for a representative of the Utah County Commission. Letters of interest with qualifications are due by 5:00 pm on 30 OCT 2026 at boards@utahcounty.gov, and the County Commission will appoint by resolution."
