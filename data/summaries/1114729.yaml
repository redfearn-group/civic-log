headline: 'Hearing 04 NOV on up to $30M county sales tax bonds for a public works facility'
summary: >-
  On 07 OCT 2026 the Utah County Commission adopted a resolution authorizing up to $30,000,000 in
  sales tax revenue bonds to build a new public works facility, and called a public hearing for 04
  NOV 2026 at 2:00 pm in Room 1400 of the County Administration Building, 100 East Center Street,
  Provo. The bonds would be repaid from county option sales tax revenue over up to 21 years, with an
  estimated total principal and interest cost of $37,561,157. Residents can speak at the hearing,
  examine the resolution at the County Clerk's office, and have 30 days from publication to contest
  its legality.
