headline: "Utah County Commission budget work session on the 2027 county budget, 27 OCT 2026"
summary: "The Utah County Commission met 27 OCT 2026 in Provo for the first of its 2027 budget work sessions. Public Works, the county Clerk, Health Department and Recorder presented new budget requests, along with a Capital Improvement Plan and a General Fund review. The minutes record department budget reviews and no votes other than adjournment. No public hearing was held. The commission approved these minutes on 18 NOV 2026."
