headline: Council hearing 08 DEC 2026 on Larson Park rezone and 141-lot, 82-townhome plat
summary: The Spanish Fork City Council will hold a public hearing on 08 DEC 2026 at 6:00 p.m. in Library Hall, 80 South Main Street, on Larson Park near 1700 West 1900 South. The request rezones the land from R-R Rural Residential to C-2, R-3 and R-1-15 with a Master Planned Development Overlay and approves a preliminary plat. Residents can speak at the hearing.
