headline: "Planning Commission 20 OCT: county data center ordinance returns, 345 kV line hearing"
summary: "The Utah County Planning Commission meets 20 OCT 2026 at 5:30 p.m. in Provo. It holds a public hearing on a requested ordinance change for electric transmission lines of 345 kV and over, and takes up the County Commission's proposed data center ordinance again, continued from 15 SEP 2026. Written comments are due by 1:00 p.m. that day to planningcommission@utahcounty.gov, and participation in the hearing is in person."
