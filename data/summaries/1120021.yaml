headline: "Utah County holds a hearing on up to $30M in sales tax revenue bonds"
summary: "The County Commission meets 04 NOV 2026 at 2:00 PM in Provo. It holds a public hearing on issuing up to $30,000,000 of sales tax revenue bonds, then votes on the bond sale documents. Residents can comment at the hearing or in public comments. It also sets an 18 NOV 2026 hearing on the 2027 county budget."
