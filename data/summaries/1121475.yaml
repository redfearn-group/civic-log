headline: "DRC reviews a new city Public Works building, a rezone and a Costco fuel expansion"
summary: "The Spanish Fork Development Review Committee meets 11 NOV 2026 at 10:00 AM in Library Hall, 80 South Main Street. Staff recommend approval of a site plan for a new city Public Works building and a six-lot final plat, and the committee takes up a residential-to-commercial rezone near 750 South 2000 East. The packet's 4 NOV 2026 minutes record approval of the Harmons, Canyon Court and 7-Eleven plans."
items:
