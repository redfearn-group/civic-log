headline: 'Utah County Commission 07 OCT: $30M sales tax bond, property tax actions'
summary: >-
  The Utah County Commission meets 07 OCT 2026 at 2:00 pm with a long agenda that includes a
  resolution on about $30,000,000 of sales tax revenue bonds, property tax actions, an email
  retention schedule, a software contract for the Community Development Block Grant system, and
  software and IT contracts with IBM, Workday and Accenture. Residents can comment in person (two
  minutes each) or watch on YouTube. The agenda lists actions only, with no dollar figures except
  the bond amount.
