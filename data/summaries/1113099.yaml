headline: "Utah County Commission 07 OCT: $30M sales tax bonds approved, new administrator"
summary: >-
  The approved minutes show the Utah County Commission adopted a resolution on about $30,000,000 of
  sales tax revenue bonds and approved property tax actions on consent on 07 OCT 2026, and appointed
  Jed Webb as County Administrator 2-0 with Commissioner Gardner absent. The email retention schedule
  was struck from the agenda and the IBM contract extension was continued to 21 OCT 2026. Ten people
  spoke in public comment, most of them asking the county to pause or ban data centers.
