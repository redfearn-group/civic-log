headline: "Three seats open on the Springville Drainage District board; letters due 30 OCT 2026"
summary: "Utah County gave notice that three trustee seats are vacant on the Springville Drainage District Board. Residents of the district who are registered voters, or Utah County officers or employees, can send a letter of interest to boards@utahcounty.gov by 5:00 p.m. on 30 OCT 2026. The County Commission will appoint the trustees by resolution."
