headline: "County planners hear a General Plan rewrite and a 240-acre industrial rezone"
summary: "The Utah County Planning Commission meets 17 NOV 2026 at 5:30 PM in Provo. It holds public hearings on a comprehensive amendment of the county General Plan, a rezone of about 240 acres from Public Facilities to Industrial (I-1) in the Spanish Fork/Springville area, and a code change adding a Rail Transfer Facility as a permitted use in the Mining and Grazing (M&G-1) zone. Written comments are due to planningcommission@utahcounty.gov by 1:00 PM that day; spoken comment is in person only."
