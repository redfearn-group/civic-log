headline: "Council hearing on South Valley Village: annexation, rezoning, 896 apartments"
summary: "On 17 NOV 2026 the Spanish Fork City Council holds a public hearing on annexing and rezoning about 2400 North Canyon Creek Parkway for South Valley Village, which proposes 896 multi-family homes in the R-4 zone and about 8 acres of C-2. The Council also considers a $750,000 Water Department metal building under a Public Works Building construction contract with Big-D. Residents can comment at the hearing, which follows a 4:30 PM work session on solid waste vouchers."
