headline: "Hearing notice: General Plan rewrite, 240-acre I-1 rezone and rail transfer use"
summary: "The Utah County Planning Commission gives notice of public hearings on 17 NOV 2026 at 5:30 PM in Room 1400 of the County Administration Building, Provo. The hearings cover a comprehensive General Plan amendment for unincorporated Utah County, a rezone of about 240 acres to Industrial (I-1) in the Spanish Fork/Springville area, and a Rail Transfer Facility as a permitted use in the M&G-1 zone. Written comments are due by 1:00 PM that day; spoken comment is in person only."
