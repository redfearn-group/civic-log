headline: Council hearing 08 DEC 2026 on rezoning part of 750 South 2000 East to commercial
summary: The Spanish Fork City Council will hold a public hearing on 08 DEC 2026 at 6:00 p.m. in Library Hall, 80 South Main Street, on the Jex Property rezone. It would change a portion of the property near 750 South 2000 East from R-1-8 Residential to C-2 General Commercial. Neighbors can speak at the hearing.
