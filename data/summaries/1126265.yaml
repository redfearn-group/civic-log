headline: Utah County hearing on pay raises for county executives in the final budget
summary: The Utah County Commission will hold a public hearing on 02 DEC 2026 at 2:00 PM in Provo on adopting a final or amended budget that includes pay increases for county executive officers. This covers the county manager, assistant manager, department heads and their chief assistants or deputies. Residents can attend and comment at the hearing.
