headline: Council hearing 08 DEC 2026 on cutting the Master Planned Development minimum to 4 acres
summary: The Spanish Fork City Council will hold a public hearing on 08 DEC 2026 at 6:00 p.m. in Library Hall, 80 South Main Street, on a Title 15 amendment for the Hollow Acres project. It would lower the minimum contiguous acreage for a Master Planned Development from five acres to four. Residents can speak at the hearing.
