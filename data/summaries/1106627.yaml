headline: "Utah County hearing on adding data centers to two zones and a new overlay zone"
summary: "The Utah County Planning Commission set a public hearing for 15 SEP 2026 at 5:30 pm on a request from the County Commission to allow data centers as a permitted use in the Mining and Grazing (M&G-1) and Industrial (I-1) zones and to create a Data Center Overlay zone. Written comments were due by 1:00 pm that day, and speaking at the hearing required attending in person. The meeting date has passed and the notice records no outcome."
