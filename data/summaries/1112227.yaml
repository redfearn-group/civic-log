headline: "Council approved Oak Village and Leland Meadows rezones, plus the FY 2027 budget revision"
summary: "On 06 OCT 2026 the City Council approved the Oak Village (110 lots) and Leland Meadows (206 lots) zone changes and preliminary plats after public hearings, and passed FY 2027 Budget Revision 1, a Cold Springs pipeline change order, the Storm Drain Master Plan update, new voter participation areas and a Zayo Group telecom franchise. Residents spoke against the data center during public comment, referendum sponsors said a referendum on the Title 15 amendment had been filed, and staff said the overlay zone and noise study will wait for that process. Staff also previewed a Transportation Utility Fee, with a public hearing proposed for 08 DEC 2026."
