headline: "Hearings tonight on Oak Village and Leland Meadows rezones, plus FY 2027 budget"
summary: "Tonight the City Council holds public hearings on two Master Planned Development rezones and preliminary plats, Oak Village (110 single-family lots) and Leland Meadows (206 lots), and on the FY 2027 salary schedule and Budget Revision 1. It also votes on a $519,902.28 pipeline change order, a new Zayo Group telecom franchise and a Storm Drain Master Plan update, and discusses a Transportation Utility Fee. The council meeting starts at 6:00 pm in the Council Chambers, and public comment is limited to three minutes per person."
