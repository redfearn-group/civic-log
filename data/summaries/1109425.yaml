headline: "Spanish Fork special meeting 21 SEP: Volition data center Title 15 amendment on agenda"
summary: "At its 21 SEP 2026 special meeting the Spanish Fork City Council took up the Volition-proposed Title 15 amendment for data centers with onsite power generation, which it had tabled on 18 AUG and again on 01 SEP. The agenda also had a hearing on vacating part of Volunteer Drive, a $1,450,000 airport property purchase, a storm drain master plan update, and work sessions on salaries and recreation fees. The meeting has passed; the attached minutes cover 18 AUG, and the notice links a video of the meeting."
items:
  - title: "Title 15 data center amendment (Volition)"
    what: "Ordinance defining data centers with onsite power and setting requirements. Staff slides say adoption lets the city accept one such application, then a site plan and development agreement."
    tags: [land-use, technology]
    watch: [data-centers, title-15]
    hearing: false
    applicant: false
    result: null
  - title: "Minutes, 18 AUG 2026: Title 15 data center hearing"
    what: "After a public hearing with extensive comment, the Council tabled the data center amendment to 01 SEP 2026 so staff could revise the language."
    tags: [land-use, technology]
    watch: [data-centers, title-15]
    hearing: false
    applicant: false
    result: "Tabled 5-0 (Oyler moved, Tooke seconded)"
  - title: "Minutes, 18 AUG 2026: Hollow Acres zone change"
    what: "Zone change from R-R and R-1-12 to C-2 (general commercial) on the northern part of a property near 400 North Spanish Fork Parkway, with a condition that Parkway improvements be built in one phase."
    tags: [land-use, roads]
    watch: []
    hearing: false
    applicant: false
    result: "Approved 5-0 (Oyler moved, Beck seconded)"
