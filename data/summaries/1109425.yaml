headline: "Council passes data center rules 3-2 with seven conditions; storm drain plan continued"
summary: "On 21 SEP 2026 the Spanish Fork City Council approved the Volition-driven Title 15 amendment for data centers with onsite power 3-2 (Cardon and Tooke opposed), with seven conditions including starting work on an overlay zone and a review of the noise ordinance. It approved the Volunteer Drive vacation and, on the consent agenda, the $1,450,000 airport land purchase, and it continued the storm drain master plan and the transportation utility fee. Results come from the meeting video and are unofficial until minutes are adopted. A site plan and a development agreement must still come back before any data center can be approved."
