headline: "Council hearing on South Valley Village: 896 apartments on 86 acres, staff says deny"
summary: "On 17 NOV 2026 the Spanish Fork City Council held a public hearing on the South Valley Village annexation, zone change and two preliminary plats at about 2400 North Canyon Creek Parkway. The plan has 896 multi-family homes, about 8 acres of commercial and a 6 acre city park, and city staff recommended denial of all four requests. Council also took up a $750,000 Water Department metal building and Public Works Building contract, a 401(k) advisor agreement and a 2000 East property purchase. The outcome is not in the posted materials."
