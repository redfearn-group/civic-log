headline: Council continued South Valley Village annexation and 896-home plan; staff urged denial
summary: On 17 NOV 2026 the City Council held a public hearing on South Valley Village, an 86-acre annexation, zone change and two preliminary plats near 2400 North Canyon Creek Parkway, and continued all four parts after saying it first needs its own talk about the area. A work session on the area is to be scheduled in the next six to eight weeks. The Council also approved a Public Works Building construction contract with a $750,000 water department metal building, plus a 401(k) advisor agreement and a right-of-way purchase.
